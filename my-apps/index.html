<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My art apps</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F7F1E6">
<style>
  :root { --ink:#2A2018; --muted:#7a6d5f; --paper:#F7F1E6; --card:#FFFDF8; --rule:rgba(42,32,24,.12);
          --icon: min(19vw, 10.5svh, 84px); }
  html { -webkit-text-size-adjust:none; text-size-adjust:none; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:calc(10px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom)); }
  main { max-width:720px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:2px 4px 0; }
  h1 { font:700 24px/1.1 Georgia,"Times New Roman",serif; margin:0; letter-spacing:-.01em; white-space:nowrap; }
  .date { color:var(--muted); font-size:13px; white-space:nowrap; }
  h2 { font:700 11px/1 system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:min(16px,2.2svh) 6px min(9px,1.2svh); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:min(10px,1.4svh) 9px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:min(7px,1svh); padding:min(14px,1.8svh) 4px; border-radius:18px; text-decoration:none; color:var(--ink);
          background:linear-gradient(180deg, color-mix(in srgb, var(--c) 14%, var(--card)), var(--card) 75%); border:1px solid color-mix(in srgb, var(--c) 28%, transparent);
          box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 16px -10px color-mix(in srgb, var(--c) 60%, transparent); transition:transform .12s ease; }
  .tile:active { transform:scale(.95); }
  .tile img { width:var(--icon); height:var(--icon); border-radius:calc(var(--icon) * .26); box-shadow:0 6px 14px -6px color-mix(in srgb, var(--c) 70%, transparent); background:var(--c); }
  .tile .n { font:700 14px/1.15 Georgia,serif; white-space:nowrap; }
  .tile .j { display:none; font-size:11.5px; color:var(--muted); line-height:1.25; }
  @media (min-width:600px) and (min-height:700px) { .tile .j { display:block; } .tile .n { font-size:16px; } }
  details { margin-top:min(18px,2.4svh); background:var(--card); border:1px solid var(--rule); border-radius:14px; }
  summary { list-style:none; cursor:pointer; padding:11px 14px; font-weight:650; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"›"; font-size:20px; color:var(--muted); transform:rotate(90deg); transition:transform .15s; }
  details[open] summary::after { transform:rotate(-90deg); }
  .upd { padding:0 14px 12px; }
  .upd p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  .row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--rule); }
  .row img { width:30px; height:30px; border-radius:8px; }
  .row .n { flex:1; font-weight:600; font-size:14px; }
  .row a { text-decoration:none; font-weight:650; font-size:13px; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); background:color-mix(in srgb, var(--c) 10%, #fff); padding:7px 11px; border-radius:10px; }
</style>
</head>
<body>
<main>
  <header><h1>My art apps</h1><div class="date" id="today"></div></header>

  <h2>Painting</h2>
  <div class="grid" id="painting"></div>

  <h2>Sarees and textiles</h2>
  <div class="grid" id="sarees"></div>

  <details>
    <summary>Update an app</summary>
    <div class="upd">
      <p>Tap Install newest, then tap the download and choose Update. Your notes stay as they are. Open this in Chrome signed in to GitHub as artbyanuprita.</p>
      <div id="updates"></div>
    </div>
  </details>
</main>
<script>
(function () {
  var GH = 'https://github.com/artbyanuprita/';
  var APPS = [
    { group:'painting', id:'studio', name:'Studio', c:'#5B7444', job:'Plan, hours, classes', web:'https://artbyanuprita.github.io/painting-studio/', webOnly:true },
    { group:'painting', id:'sadhana', name:'साधना', c:'#2C6E6A', job:'Today’s practice', scheme:'sadhana', pkg:'com.artbyanuprita.sadhana', repo:'sadhana-app', file:'sadhana', web:'https://claude.ai/artifact/6MRpx66BhRqiAwVt81ENaz' },
    { group:'painting', id:'rangkosh', name:'Rang Kosh', c:'#C8892B', job:'Pigments, jars', scheme:'rangkosh', pkg:'com.artbyanuprita.rangkosh', repo:'rang-kosh-app', file:'rang-kosh', web:'https://anu-colour-notes.pages.dev/' },
    { group:'painting', id:'chitradhar', name:'चित्राधार', c:'#7A4A2A', job:'Grounds, canvases', scheme:'chitradhar', pkg:'com.artbyanuprita.chitradhar', repo:'chitradhar-app', file:'chitradhar', web:'https://claude.ai/artifact/QupL8F4KbVMbhUbFNuqEro' },
    { group:'painting', id:'aba', name:'Art by Anuprita', short:'Anuprita', c:'#A23A28', job:'Paintings, art forms', scheme:'artbyanuprita', pkg:'com.artbyanuprita.app', repo:'art-by-anuprita-app', file:'art-by-anuprita', web:'https://anu-studio-notes.pages.dev/' },
    { group:'sarees', id:'sutradhyaksha', name:'सूत्राध्यक्ष', c:'#7A1F2B', job:'My sarees, the book', scheme:'vastrakatha', pkg:'com.vastrakatha.app', repo:'vastra-katha-app', file:'sutradhyaksha', web:'https://claude.ai/artifact/AQx7tYkKQ47wbhBsPsYGbz' },
    { group:'sarees', id:'dhaaga', name:'Dhaaga', c:'#25336E', job:'Textile atlas', scheme:'dhaaga', pkg:'com.artbyanuprita.textileatlas', repo:'textile-atlas-app', file:'dhaaga', web:'https://claude.ai/artifact/AufpsfwWimFjMMWGgtABZC' }
  ];
  var android = /Android/i.test(navigator.userAgent);
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]; }); };
  try { document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' }); } catch (e) {}
  APPS.forEach(function (a) {
    var href = a.webOnly ? a.web : android ? 'intent://home#Intent;scheme=' + a.scheme + ';package=' + a.pkg + ';end' : a.web;
    var ext = (!android || a.webOnly) ? ' target="_blank" rel="noopener"' : '';
    document.getElementById(a.group).insertAdjacentHTML('beforeend',
      '<a class="tile" style="--c:' + a.c + '" href="' + esc(href) + '"' + ext + '><img src="' + a.id + '.png" alt=""><div class="n">' + esc(a.short || a.name) + '</div><div class="j">' + esc(a.job) + '</div></a>');
    if (!a.webOnly) document.getElementById('updates').insertAdjacentHTML('beforeend',
      '<div class="row" style="--c:' + a.c + '"><img src="' + a.id + '.png" alt=""><span class="n">' + esc(a.name) + '</span><a href="' + GH + a.repo + '/releases/download/newest/' + a.file + '.apk">Install newest</a></div>');
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
