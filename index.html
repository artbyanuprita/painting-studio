  const fromTimer = !!(pre && pre.fromTimer);
  const choices = paintingsArr().sort((a,b)=>(ACTIVE.has(b.status)-ACTIVE.has(a.status)));
  openSheet(s ? "Edit studio session" : fromTimer ? "Save timed session" : "Log studio session", `<div class="fgrid">
    ${fromTimer?`<div class="full banner" style="margin:0">Timer stopped at ${fmtHours(pre.hours)} h of painting${pre.breakMin?` (${pre.breakMin} min of breaks not counted)`:""}. Add notes and save, or close this form to keep the timer going.</div>`:""}
    ${p?`<div class="full small muted">${esc(p.id)} · ${esc(p.title)}</div>`:`<label class="f full"><span>Painting</span>${sel('id="ss-p"', choices.map(x=>[x.id, `${x.id} · ${x.title}${ACTIVE.has(x.status)?" (active)":""}`]), "")}</label>`}
    <label class="f"><span>Date</span><input class="in" type="date" id="ss-date" value="${attr(e.date||todayISO())}"></label>
    <label class="f"><span>Duration (hours)</span><input class="in num" type="number" step="0.25" min="0" id="ss-hours" value="${attr(e.hours??"")}" placeholder="or use times"></label>
    <label class="f"><span>Start time</span><input class="in" type="time" id="ss-start" value="${attr(e.start||"")}"></label>
    <label class="f"><span>End time</span><input class="in" type="time" id="ss-end" value="${attr(e.end||"")}"></label>
    <label class="f full"><span>Phase</span>${sel('id="ss-phase"', [["",""],...((p?p.stages:normPainting({}).stages).map(st=>st.name))], e.phase||"")}</label>
    <label class="f full"><span>Work completed</span><textarea class="in" id="ss-work">${esc(e.work||"")}</textarea></label>
    <label class="f full"><span>Materials used</span><textarea class="in" id="ss-mat">${esc(e.materials||"")}</textarea></label>
    <label class="f full"><span>Problems</span><textarea class="in" id="ss-prob">${esc(e.problems||"")}</textarea></label>
    <label class="f full"><span>Observations</span><textarea class="in" id="ss-obs">${esc(e.observations||"")}</textarea></label>
    <label class="f full"><span>Next steps</span><textarea class="in" id="ss-next">${esc(e.next||"")}</textarea></label>
    ${S.assets?`<label class="f full photoin"><span>${ICON.camera} Add progress photo (optional)</span><input class="in" type="file" accept="image/*" id="ss-photo" multiple></label>`:""}</div>
    <div class="row"><button class="btn primary" data-sh="save">Save session</button><button class="btn" data-sh="close">${fromTimer?"Keep timer running":"Cancel"}</button>${s?confirmBtn("Delete session"):""}${fromTimer?confirmBtn("Discard timer","discard"):""}</div>`,
  { discard: btn => { if(!twoStep(btn,"Tap again to discard this time")) return; p.timer = null; savePainting(p, 0); closeOverlay(true); render(); toast("Timer discarded"); },
    save: () => {
      const target = p || S.paintings.get(v("ss-p")); if(!target){ toast("Choose a painting."); return; }
      let hours = parseFloat(v("ss-hours")); const st=v("ss-start"), en=v("ss-end");
      if((!hours || isNaN(hours)) && st && en){ const [a,b]=st.split(":").map(Number), [c,d]=en.split(":").map(Number); hours = Math.max(0, ((c*60+d)-(a*60+b))/60); }
      if(!hours || isNaN(hours) || hours<=0){ toast("Enter a duration, or a start and end time."); return; }
      const rec = {id:s?s.id:uid("ss"), date:v("ss-date")||todayISO(), start:st, end:en, hours:Math.round(hours*100)/100, phase:v("ss-phase"), work:v("ss-work"), materials:v("ss-mat"), problems:v("ss-prob"), observations:v("ss-obs"), next:v("ss-next")};
      if(s) Object.assign(s, rec); else target.sessions.push(rec);
      if(fromTimer) target.timer = null;
      const sfiles = $("#ss-photo") && $("#ss-photo").files ? [...$("#ss-photo").files] : [];
      if(target.status==="Not Started") applyStatus(target, "Painting");
      if(!s) logAct("session", `Logged ${fmtHours(rec.hours)} h on ${target.id} ${target.title}`, target.id);
      savePainting(target); closeOverlay(true); render(); toast(`Session saved · ${fmtHours(pHours(target))} h total`);
      if(sfiles.length) uploadPhotos(target, "progress", sfiles, {sessionId:rec.id, date:rec.date}); },
    del: (btn) => { if(!twoStep(btn,"Tap again to delete session")) return; p.sessions = p.sessions.filter(x=>x.id!==sid); savePainting(p); closeOverlay(true); render(); } });
}

/* ---- library records (pigments, surfaces) */
function sheetRecord(kind, rec, forPid){
  const K = KINDS[kind]; const e = rec || {}; const used = rec ? recUsedBy(kind, rec.id) : [];
  const field = ([k,label,type,opt]) => { const o = Array.isArray(opt)?{}:(opt||{}); const v = e[k] ?? "";
    if(type==="textarea") return `<label class="f full"><span>${esc(label)}</span><textarea class="in" id="rc-${k}">${esc(v)}</textarea></label>`;
    if(type==="select") return `<label class="f"><span>${esc(label)}</span>${sel(`id="rc-${k}"`, opt.map(x=>[x,x||"—"]), v)}</label>`;
    if(type==="color") return `<label class="f"><span>${esc(label)}</span><span class="row" style="flex-wrap:nowrap"><input type="color" id="rc-${k}" value="${attr(/^#[0-9a-f]{6}$/i.test(v)?v:"#c2381f")}" style="width:56px;height:40px;border:0;background:none;padding:0"><label class="row small"><input type="checkbox" id="rc-${k}-none" ${v?"":"checked"}> No swatch</label></span></label>`;
    return `<label class="f${k==="name"?" full":""}"><span>${esc(label)}</span><input class="in" id="rc-${k}" value="${attr(v)}" ${o.ph?`placeholder="${attr(o.ph)}"`:""} ${k==="name"&&!rec?"autofocus":""}></label>`; };
  openSheet(rec ? e.name : `New ${K.title.toLowerCase()}`, `<div class="fgrid">${K.fields.map(field).join("")}</div>
    ${used.length?`<div class="stack-s"><div class="cap">Used in</div>${used.map(p=>`<a href="#" class="small" data-act="open-ws" data-id="${attr(p.id)}">${esc(p.id)} · ${esc(p.title)}</a>`).join("")}</div>`:""}
    <div class="row"><button class="btn primary" data-sh="save">Save</button><button class="btn" data-sh="close">Cancel</button>${rec?confirmBtn("Delete"):""}</div>`,
  { save: () => { const name = v("rc-name"); if(!name){ toast("Give it a name."); return; }
      const r = Object.assign(rec || {id:uid(kind==="pigments"?"pg":kind==="binders"?"bd":"sf"), createdAt:nowISO()}, {});
      for(const [k,,type] of K.fields){ r[k] = type==="color" ? (v(`rc-${k}-none`) ? "" : v(`rc-${k}`)) : v(`rc-${k}`); }
      r.updatedAt = nowISO(); K.map().set(r.id, r); persist(kind+"/"+r.id, r);
      if(!rec) logAct(kind, `Added ${K.title.toLowerCase()}: ${name}`);
      if(forPid){ const p = S.paintings.get(forPid); if(p){ if(kind==="pigments"){ if(!p.pigmentIds.includes(r.id)) p.pigmentIds.push(r.id); } else if(kind==="binders"){ p.binderIds = p.binderIds||[]; if(!p.binderIds.includes(r.id)) p.binderIds.push(r.id); } else p.surfaceId = r.id; savePainting(p); } }
      closeOverlay(true); render(); toast("Saved"); },
    del: btn => { if(!twoStep(btn, used.length?`Tap again — it will be removed from ${used.length} painting${used.length>1?"s":""}`:"Tap again to delete")) return;
      for(const p of used){ if(kind==="pigments") p.pigmentIds = p.pigmentIds.filter(x=>x!==rec.id); else if(kind==="binders") p.binderIds = (p.binderIds||[]).filter(x=>x!==rec.id); else p.surfaceId=""; savePainting(p); }
      K.map().delete(rec.id); persist(kind+"/"+rec.id, null, 0); closeOverlay(true); render(); } });
}

async function compressImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.2e6) return file;
  try{
    const bmp = await createImageBitmap(file); const max = 2400; const k = Math.min(1, max/Math.max(bmp.width, bmp.height));
    if(k===1 && file.size<6e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.86)); return blob && blob.size < file.size ? blob : file;
  }catch(e){ return file; }
}
async function uploadPhotos(p, type, files, extra={}){
  if(!S.assets){ toast("Photo storage isn't connected. Open Add photo and tap Try again.", 4500); return; }
  const list = [...files]; let ok = 0;
  for(let i=0;i<list.length;i++){
    toast(`Uploading photo ${i+1} of ${list.length}…`, 60000);
    try{
      const blob = await compressImage(list[i]);
      const t = blob.type && /^image\//.test(blob.type) ? blob.type : (list[i].type || "image/jpeg");
      const res = await S.assets.upload(blob, {type: t==="image/jpg"?"image/jpeg":t, pid:p.id, kind:type, chapter:p.bookChapter||"", date:extra.date||todayISO()});
      p.photos.push({id:uid("ph"), asset:res.id, type, date:extra.date||todayISO(), caption:"", notes:"", name:list[i].name||"", sessionId:extra.sessionId||""}); ok++;
      savePainting(p, 0);
    }catch(e){
      console.error(e);
      const msg = e && e.code==="unsupported_type" ? "That file type can't be stored. Use JPEG, PNG or WebP." : e && e.code==="too_large" ? "That photo is over 20 MB." : e && e.code==="quota_or_state" ? "Photo storage is full." : "Upload failed. Check the connection and try again.";
      toast(msg, 5000); break;
    }
  }
  if(ok){ logAct("photo", `Added ${ok} ${type} photo${ok>1?"s":""} to ${p.id} ${p.title}`, p.id); toast(`${ok} photo${ok>1?"s":""} saved`); }
  render();
}

async function bulkWrite(ops, label){
  if(S.mode!=="db"){ toast("Not connected to the studio database."); return 0; }
  let n=0;
  for(const [path, body] of ops){
    try{ await S.db.doc(path).set(body); n++; }catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,700)); try{ await S.db.doc(path).set(body); n++; continue; }catch(e2){} } console.error(e); toast(`${label} stopped after ${n} of ${ops.length}: ${e.code||"error"}`, 6000); return n; }
    if(n%10===0) toast(`${label}: ${n} of ${ops.length}…`, 60000);
  }
  toast(`${label}: ${n} of ${ops.length} done`); return n;
}
function restoreFrom(text){

  if(!b || b.app!=="indian-painting-studio"){ toast("That file isn't an Indian Painting Studio backup."); return; }
  const coll = [["paintings",b.paintings,"id"],["tasks",b.tasks,"id"],["ideas",b.ideas,"id"],["resources",b.resources,"id"],["meta",b.meta,"_key"],["activity",b.activity,"month"],["pigments",b.pigments,"id"],["surfaces",b.surfaces,"id"],["binders",b.binders,"id"],["outreach",b.outreach,"id"],["venues",b.venues,"id"],["ifam",b.ifam,"id"],["journals",b.journals,"key"],["learning",b.learning,"id"]];
  const cur = {paintings:S.paintings,tasks:S.tasks,ideas:S.ideas,resources:S.resources,meta:S.meta,activity:S.activity,pigments:S.pigments,surfaces:S.surfaces,binders:S.binders,outreach:S.outreach,venues:S.venues,ifam:S.ifam,journals:S.journals,learning:S.learning};
  const summ = coll.map(([c,arr,k])=>{ arr=arr||[]; const match = arr.filter(x=>cur[c].has(x[k])).length; return [c, arr.length, match]; });
  openSheet("Restore backup", `<div class="small">Backup from ${fmtDate(b.exportedAt)}.</div>
    <div class="tablewrap"><table><thead><tr><th>Records</th><th>In backup</th><th>Already here</th></tr></thead><tbody>${summ.map(([c,n,m])=>`<tr><td>${esc(c)}</td><td class="num">${n}</td><td class="num">${m}</td></tr>`).join("")}</tbody></table></div>

document.addEventListener("change", e => {
  const el = e.target; const d = el.dataset || {};
  if(d.pf){ const p = S.paintings.get(d.pf); if(!p) return; const k = d.k; const val = el.value;
    if(k==="status"){ if(val==="Deferred" && p.status!=="Deferred"){ el.value = p.status; sheetDefer(p); return; } if(p.status==="Deferred" && val!=="Deferred"){ el.value=p.status; sheetReintroduce(p); return; } applyStatus(p, val); savePainting(p); render(); return; }
    if(k==="month" || k==="week"){ reschedule(p, k==="month"?val:p.month, k==="week"?val:p.week, ""); savePainting(p); scheduleRender(); return; }
    if(p[k]===val) return; p[k] = val; savePainting(p);
    if(k==="title"||k==="completedDate") scheduleRender();
    debounce(()=>logAct("edit", `Edited ${p.id} ${p.title}`, p.id), 0)();
    return; }
  if(d.pfCheck){ const p=S.paintings.get(S.ui.ws); p[d.pfCheck]=el.checked; savePainting(p); if(d.pfCheck==="portfolio") logAct("portfolio", `${el.checked?"Added":"Removed"} ${p.id} ${p.title} ${el.checked?"to":"from"} the portfolio`, p.id); return; }
  if(d.stageDone){ const p=S.paintings.get(S.ui.ws); const s=p.stages.find(x=>x.id===d.stageDone); s.done=el.checked; s.doneAt=el.checked?todayISO():""; savePainting(p); if(el.checked) logAct("stage", `${p.id}: ${s.name} done`, p.id); render(); return; }
  if(d.stageName){ const p=S.paintings.get(S.ui.ws); const s=p.stages.find(x=>x.id===d.stageName); const n=el.value.trim(); if(n && n!==s.name){ s.name=n; savePainting(p); } return; }
  if(d.taskDone){ const t=S.tasks.get(d.taskDone); t.done=el.checked; t.status=el.checked?"Done":"To do"; t.doneAt=el.checked?todayISO():""; saveTask(t); if(el.checked) logAct("task", `Completed task: ${t.title}`, t.paintingId); setTimeout(render, 250); return; }
  if(el.hasAttribute && el.hasAttribute("data-cal-select")){ if(S.ui.moving){ const p=S.paintings.get(S.ui.moving); moveTo(el.value, p?p.week:""); } else { S.ui.calMonth = el.value; render(); } return; }
  if(el.hasAttribute && el.hasAttribute("data-pick-pig")){ const p=S.paintings.get(S.ui.ws); if(p && el.value && !p.pigmentIds.includes(el.value)){ p.pigmentIds.push(el.value); savePainting(p); render(); } return; }
  if(el.hasAttribute && el.hasAttribute("data-pick-surface")){ const p=S.paintings.get(S.ui.ws); if(p){ p.surfaceId = el.value; savePainting(p); render(); } return; }
  if(el.hasAttribute && el.hasAttribute("data-book-add")){ const p=S.paintings.get(el.value); if(p){ p.book=true; p.bookChapter=el.dataset.bookAdd; savePainting(p); logAct("book", `Added ${p.id} ${p.title} to book chapter ${p.bookChapter}`, p.id); render(); } return; }
  if(d.pfilter){ S.ui.pf[d.pfilter] = el.value; render(); return; }
  if(d.wf){ S.ui.wf[d.wf] = el.value; S.ui.wlimit=25; render(); return; }
  if(d.rv){ S.ui.rv[d.rv] = el.value; render(); return; }
  if(d.elNote){ saveMeta("element", d.elNote, {notes:el.value}); return; }
  if(d.elDone){ const m=getMeta("element", d.elDone); saveMeta("element", d.elDone, {done:el.checked}); if(el.checked) logAct("edit", `Practised element ${d.elDone.split("|")[1]} in ${d.elDone.split("|")[0]}`, ""); scheduleRender(); return; }
  if(d.themeNote){ saveMeta("theme", d.themeNote, {notes:el.value}); return; }
  if(d.set){ const k=d.set; let val = el.value;
    if(k==="months"||k==="monthlyTarget"){ val = Math.max(1, Math.min(k==="months"?36:60, parseInt(val)||1)); }
    if(k==="bookChapters"){ val = el.value.split(/\n+/).map(x=>x.trim()).filter(Boolean); }
    if(k==="defaultStages"){ val = el.value.split(/\n+/).map(x=>x.trim()).filter(Boolean); if(!val.length) val = DEFAULT_STAGES.slice(); }
    if(k==="periodStart" && !/^\d{4}-\d{2}$/.test(val)) return;
    S.settings[k] = val; saveSettings(); logAct("settings", `Changed setting: ${k}`); scheduleRender(); return; }
  if(d.upload){ const p=S.paintings.get(d.uploadP || S.ui.ws); const files = el.files ? [...el.files] : []; el.value=""; if(d.uploadP) closeOverlay(true); if(p && files.length){ if(d.uploadP){ S.ui.wsSec="photos"; } uploadPhotos(p, d.upload, files); } return; }
  if(el.hasAttribute && el.hasAttribute("data-restore")){ const f=el.files && el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restoreFrom(String(r.result)); r.readAsText(f); el.value=""; return; }

function moveTo(month, week){
  const p = S.paintings.get(S.ui.moving); S.ui.moving = null; if(!p){ render(); return; }
  if(month===p.month && week===p.week){ render(); return; }
  reschedule(p, month, week, "Moved on calendar board"); savePainting(p); render();
  toast(`${p.id} moved to ${monthLabel(month)} · ${week}`);
}

const OR_TRACKS = ["Art research","PhD faculty","Museum","Gallery","Venue","Other"];
const OR_STATUS = ["To contact","Emailed","Replied","Meeting set","In discussion","Closed"];
const VN_TYPES = ["Gallery","Museum","Café / venue","Fair / market","Call for artists","University","Other"];

function addDays(iso, n){ const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ifamPlan(){ return S.ifam.get("plan") || {id:"plan", year:"2028", anchors:[], checklist:[], dates:[], notes:""}; }
function saveIfam(plan){ plan.updatedAt = nowISO(); S.ifam.set("plan", plan); persist("ifam/plan", plan); }
function money(n){ n = +n||0; return n ? "$"+n.toLocaleString(undefined,{maximumFractionDigits:2}) : "$0"; }

/* items that need attention, shown on Home */
function outreachDue(){
  const t = todayISO(); const soon = addDays(t, 14); const out = [];
  for(const c of S.outreach.values()) if(c.status!=="Closed" && c.nextFollowUp && c.nextFollowUp<=t) out.push({kind:"contact", id:c.id, title:`Follow up: ${c.name}`, sub:[c.org, c.nextFollowUp<t?"due "+fmtDate(c.nextFollowUp):"due today"].filter(Boolean).join(" · "), late:c.nextFollowUp<t});
  for(const v of S.venues.values()) if(v.deadline && !["Closed","Declined","Applied","Accepted","Showing"].includes(v.status) && v.deadline<=soon) out.push({kind:"venue", id:v.id, title:`Deadline: ${v.name}`, sub:fmtDate(v.deadline), late:v.deadline<t});
  const plan = ifamPlan(); for(const d of plan.dates||[]) if(d.date && d.date>=t && d.date<=soon) out.push({kind:"ifam", id:"", title:`IFAM ${plan.year}: ${d.label}`, sub:fmtDate(d.date), late:false});
  return out;
}
function outreachDueLines(){ return outreachDue().map(x=>`<div class="item click" data-or-open="${x.kind}" data-id="${attr(x.id)}"><div class="grow"><div class="t">${esc(x.title)}</div><div class="small muted">${esc(x.sub)}</div></div>${x.late?'<span class="pill bad">Overdue</span>':'<span class="pill active">Soon</span>'}</div>`).join(""); }

VIEWS.outreach = function(){
  const sub = S.ui.orTab || "ifam";
  const due = outreachDue();
  const chips = `<div class="chips">${[["ifam","IFAM"],["contacts",`Contacts (${S.outreach.size})`],["venues",`Exhibitions & displays (${S.venues.size})`]].map(([k,l])=>`<button class="chip" data-ortab="${k}" aria-pressed="${sub===k}">${l}</button>`).join("")}</div>`;
  const dueBox = due.length ? `<section class="panel" data-nofold><div class="hd"><h2>Needs attention</h2><span class="small muted num">${due.length}</span></div><div class="bd"><div class="list">${outreachDueLines()}</div></div></section>` : "";
  const body = sub==="contacts" ? contactsView() : sub==="venues" ? venuesView() : ifamView();
  return `<div class="stack"><div><h2>Outreach</h2><div class="small muted">IFAM application, museum and university contacts, exhibitions and displays.</div></div>${chips}${dueBox}${body}</div>`;
};

/* ---------------- IFAM */
function ifamView(){

/* ---------------- events */
Object.assign(ACTS, {});
document.addEventListener("click", e => {
  const t = e.target; let el;
  if((el = t.closest("[data-ortab]"))){ S.ui.orTab = el.dataset.ortab; render(); return; }
  if((el = t.closest("[data-ortrack]"))){ S.ui.orTrack = el.dataset.ortrack; render(); return; }
  if((el = t.closest("[data-or-new]"))){ el.dataset.orNew==="contact" ? sheetContact(null) : sheetVenue(null); return; }
  if((el = t.closest("[data-or-logemail]"))){ e.stopPropagation(); const c = S.outreach.get(el.dataset.orLogemail); const d = todayISO(); const first = c.status==="To contact";
    c.log = [...(c.log||[]), {date:d, note:first?"Emailed":"Followed up"}]; c.lastContact = d; if(first) c.status = "Emailed"; c.nextFollowUp = addDays(d, 14); saveOutreach(c); logAct("outreach", `${first?"Emailed":"Followed up with"} ${c.name}`); render(); toast(`Logged. Follow-up set for ${fmtDate(c.nextFollowUp)}`); return; }
  if((el = t.closest("[data-or-open]"))){ const k = el.dataset.orOpen; if(k==="contact") sheetContact(el.dataset.id); else if(k==="venue") sheetVenue(el.dataset.id); else { S.ui.orTab="ifam"; go("outreach"); } return; }
  if((el = t.closest("[data-ifam-add]"))){ const k = el.dataset.ifamAdd; const plan = ifamPlan();
    if(k==="anchor"){ sheetAnchor(null); return; }
    if(k==="dates"){ const label=v("ifd-label"); if(!label){ toast("Name the date."); return; } plan.dates=[...(plan.dates||[]), {id:uid("d"), label, date:v("ifd-date")}]; }
    if(k==="checklist"){ const text=v("ifc-text"); if(!text){ toast("Write the item."); return; } plan.checklist=[...(plan.checklist||[]), {id:uid("c"), text, due:v("ifc-due"), done:false}]; }
    saveIfam(plan); render(); return; }
  if((el = t.closest("[data-ifam-del]"))){ const plan = ifamPlan(); const k = el.dataset.ifamDel; plan[k] = (plan[k]||[]).filter(x=>x.id!==el.dataset.id); saveIfam(plan); render(); return; }
  if((el = t.closest("[data-ifam-edit-anchor]"))){ sheetAnchor(el.dataset.ifamEditAnchor); return; }
  if((el = t.closest("[data-ifam-unpick]"))){ const plan = ifamPlan(); const a = plan.anchors.find(x=>x.id===el.dataset.ifamUnpick); if(a){ a.paintingIds = (a.paintingIds||[]).filter(x=>x!==el.dataset.pid); saveIfam(plan); render(); } return; }
  if((el = t.closest("[data-vi-del]"))){ const x = S.venues.get(SH.venueId); if(!x) return; if(el.dataset.armed!=="1"){ el.dataset.armed="1"; el.style.background="var(--bad-soft)"; toast("Tap × again to remove this piece"); return; } x.items = x.items.filter(i=>i.id!==el.dataset.viDel); saveVenue(x); closeOverlay(true); sheetVenue(x.id); return; }

function slugify(t){ return String(t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "chapter"; }
function jChapter(title){ const T = S.ref.journal; return T ? T.chapters.find(c=>norm(c.title)===norm(title)) || null : null; }
function jKey(title){ return slugify(title); }
function jDoc(title){ return S.journals.get(jKey(title)) || {key:jKey(title), title, answers:{}, cover:{}}; }
function jFields(){ const T = S.ref.journal; return T ? T.sections.flatMap(s=>s.questions.map(q=>q.field)) : []; }
function jCount(d){ const a = d.answers||{}; const f = jFields(); return {done:f.filter(k=>String(a[k]||"").trim()).length, total:f.length||93}; }
function jSecCount(d, s){ const a = d.answers||{}; return s.questions.filter(q=>String(a[q.field]||"").trim()).length; }
function jSave(d, delay=900){ d.updatedAt = nowISO(); if(!d.cover) d.cover = {}; if(!d.cover.started) d.cover.started = todayISO(); S.journals.set(d.key, d); persist("journals/"+d.key, d, delay); }

/* studio records that relate to a chapter */
function jTokens(title){ return norm(title).replace(/\b(painting|art|scroll|the|and)\b/g," ").split(/[^a-z]+/).filter(w=>w.length>=4); }
function jMatch(title, s){ const t = jTokens(title); const x = norm(s); return t.length && t.some(w=>x.includes(w)); }
function jHints(title, n){
  const out = [];
  if(n===3){ const ws = IX.wsList.filter(w=>jMatch(title, w["Art Form / Tradition"]+" "+wsEff(w).art)); if(ws.length){ const by = new Map(); for(const w of ws){ const k = wsEff(w).teacher || "Teacher not recorded"; if(!by.has(k)) by.set(k, []); by.get(k).push(w); }
      const text = [...by.entries()].sort((a,b)=>b[1].length-a[1].length).map(([t,l])=>`${t} — ${[...new Set(l.map(w=>w["Provider group"]))].join(", ")} — ${l.length} record${l.length>1?"s":""}: ${l.slice(0,8).map(w=>wsEff(w).title).join("; ")}${l.length>8?"; …":""}`).join("\n");
      out.push({field:"s03_q01_008", label:`${ws.length} workshop records from your archive, by teacher`, text}); } }
  if(n===6){ const r = [...S.surfaces.values()].filter(x=>jMatch(title, [x.tradition,x.name,x.notes].join(" "))); if(r.length) out.push({field:"s06_q03_027", label:`${r.length} of your surface records`, text:r.map(x=>`${x.name}${x.surfaceType?" ("+x.surfaceType+")":""}: ${[x.base&&"base "+x.base, x.layers&&"layers: "+x.layers, x.preparation&&"steps: "+x.preparation, x.curing&&"drying: "+x.curing, x.finishing&&"finishing: "+x.finishing].filter(Boolean).join("; ")}`).join("\n")}); }
  if(n===7){ const r = [...S.pigments.values()].filter(x=>jMatch(title, [x.traditions,x.notes].join(" "))); if(r.length) out.push({field:"s07_q02_033", label:`${r.length} pigments from your library`, text:r.map(x=>`${x.name}${x.sourceType||x.source?" ("+[x.sourceType,x.source].filter(Boolean).join(", ")+")":""}: ${[x.binder&&"binder "+x.binder, x.preparation&&"prepared: "+x.preparation].filter(Boolean).join("; ")}`).join("\n")}); }
  if(n===10){ const ps = paintingsArr().filter(p=>(p.book && norm(p.bookChapter)===norm(title)) || jMatch(title, p.tradition+" "+p.artForm)); if(ps.length) out.push({field:"s10_q01_056", label:`${ps.length} of your paintings in this tradition`, text:ps.map(p=>{ const s=S.surfaces.get(p.surfaceId); const pg=p.pigmentIds.map(id=>S.pigments.get(id)).filter(Boolean).map(x=>x.name);
      return `${p.title} (${p.id}) — ${[p.completedDate?p.completedDate.slice(0,4):"in progress", p.dimensions, s?s.name:p.surface, pg.length?"pigments: "+pg.join(", "):p.pigments, p.status].filter(Boolean).join(", ")}`; }).join("\n")}); }
  return out;
}

/* ---- PDF in and out */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
async function ensurePdfLib(){ if(!window.PDFLib) await loadScript(PDFLIB_URL); if(!window.fontkit) await loadScript(FONTKIT_URL); }
function wrapText(text, font, size, width){
  const lines = [];
  for(const para of String(text).split(/\n/)){
    if(!para.trim()){ lines.push(""); continue; }
    let cur = ""; for(const word of para.split(/\s+/)){ const t = cur ? cur+" "+word : word; if(font.widthOfTextAtSize(t, size) <= width) cur = t; else { if(cur) lines.push(cur); let w = word; while(font.widthOfTextAtSize(w, size) > width){ let k = w.length; while(k>1 && font.widthOfTextAtSize(w.slice(0,k), size) > width) k--; lines.push(w.slice(0,k)); w = w.slice(k); } cur = w; } }
    lines.push(cur);
  }
  return lines;
}
async function journalPDF(title){
  await ensurePdfLib(); const {PDFDocument, rgb} = window.PDFLib; const T = S.ref.journal; const d = jDoc(title); const ch = jChapter(title);
  const [pdfBytes, fontBytes] = await Promise.all([fetch("data/journals/"+(ch?ch.slug:"blank")+".pdf").then(r=>{ if(!r.ok) throw new Error("template"); return r.arrayBuffer(); }), fetch("data/fonts/DejaVuSans.ttf").then(r=>r.arrayBuffer())]);
  const doc = await PDFDocument.load(pdfBytes); doc.registerFontkit(window.fontkit);
  const font = await doc.embedFont(fontBytes, {subset:true}); const form = doc.getForm();
  const set = (name, val) => { try{ const f = form.getTextField(name); try{ f.setMaxLength(undefined); }catch(_){} f.setFontSize(9); f.setText(String(val||"")); }catch(e){ console.warn("field", name, e); } };
  const cov = d.cover||{};
  set("cover_0", cov.author||""); set("cover_1", cov.started?fmtDate(cov.started):""); set("cover_2", d.updatedAt?fmtDate(d.updatedAt):fmtDate(todayISO())); set("cover_3", cov.status||"");
  for(const s of T.sections) for(const q of s.questions) set(q.field, (d.answers||{})[q.field]||"");
  form.updateFieldAppearances(font);
  // appendix: every answer in full, so nothing is cut off when printed
  const answered = T.sections.map(s=>({s, qs:s.questions.filter(q=>String((d.answers||{})[q.field]||"").trim())})).filter(x=>x.qs.length);
  if(answered.length){
    const W = 595.28, H = 841.89, M = 48, width = W-2*M; let page = doc.addPage([W,H]); let y = H-M;
    const line = (txt, size, color, gap=4) => { if(y < M+size){ page = doc.addPage([W,H]); y = H-M; } page.drawText(txt, {x:M, y:y-size, size, font, color}); y -= size+gap; };
    line(`${title} — answers in full`, 16, rgb(.36,.24,.16), 6); line(`From Indian Painting Studio · ${fmtDate(todayISO())}`, 9, rgb(.45,.45,.45), 14);
    for(const {s, qs} of answered){ y -= 6; line(`${s.n}. ${s.title}`, 12.5, rgb(.36,.24,.16), 6);
      for(const q of qs){ for(const l of wrapText(q.q, font, 9.5, width)) line(l, 9.5, rgb(.35,.35,.35), 2); y -= 2;
        for(const l of wrapText((d.answers||{})[q.field], font, 10.5, width)) line(l, 10.5, rgb(.1,.1,.1), 3); y -= 8; } }
  }
  return await doc.save();
}
async function downloadJournal(title){
  if(!S.downloads){ toast("Downloading files isn't available in this view.", 4000); return; }
  toast("Preparing your PDF…", 60000);
  try{ const bytes = await journalPDF(title); await S.downloads.save({filename:`${title.replace(/[^A-Za-z0-9]+/g,"_")}_Chapter_Journal.pdf`, data:new Blob([bytes], {type:"application/pdf"})}); toast("PDF ready"); logAct("journal", `Downloaded ${title} journal PDF`); }
  catch(e){ console.error(e); toast(e && e.code==="declined" ? "Download cancelled" : "Couldn't make the PDF. Check the connection and try again.", 5000); }
}
async function importJournalPDF(title, file){
  try{
    toast("Reading the PDF…", 30000); await ensurePdfLib(); const {PDFDocument} = window.PDFLib; const doc = await PDFDocument.load(await file.arrayBuffer()); const form = doc.getForm();
    const T = S.ref.journal; const d = jDoc(title); const found = {}; const get = n => { try{ return form.getTextField(n).getText()||""; }catch(_){ return ""; } };
    for(const s of T.sections) for(const q of s.questions){ const t = get(q.field).trim(); if(t) found[q.field] = t; }
    const cover = {author:get("cover_0").trim(), status:get("cover_3").trim()};
    const n = Object.keys(found).length; const conflicts = Object.keys(found).filter(k=>String((d.answers||{})[k]||"").trim() && String(d.answers[k]).trim()!==found[k]).length;
    const newOnes = Object.keys(found).filter(k=>!String((d.answers||{})[k]||"").trim()).length;
    if(!n){ toast("No filled answers found in that PDF."); return; }
    openSheet("Import answers", `<div class="small">Found <b>${n}</b> answers in “${esc(file.name)}”: ${newOnes} for questions still empty here${conflicts?`, and ${conflicts} that differ from what you've written here`:""}.</div>
      <div class="row"><button class="btn primary" data-sh="fill">Fill empty answers only</button>${conflicts?`<button class="btn" data-sh="replace">Use the PDF's text for all ${n}</button>`:""}<button class="btn" data-sh="close">Cancel</button></div>`,
    { fill: () => { const dd = jDoc(title); dd.answers = dd.answers||{}; for(const [k,t] of Object.entries(found)) if(!String(dd.answers[k]||"").trim()) dd.answers[k]=t; dd.cover = dd.cover||{}; if(cover.author && !dd.cover.author) dd.cover.author = cover.author; if(cover.status && !dd.cover.status) dd.cover.status = cover.status; jSave(dd, 0); closeOverlay(true); render(); toast(`${newOnes} answers added`); },
      replace: () => { const dd = jDoc(title); dd.answers = {...(dd.answers||{}), ...found}; jSave(dd, 0); closeOverlay(true); render(); toast(`${n} answers imported`); } });
  }catch(e){ console.error(e); toast("Couldn't read that PDF.", 4000); }
}

function chapPill(r){
  if(r.ready) return `<span class="pill done">Ready</span>`;
  if(r.ps.some(p=>p.status==="Completed")) return `<span class="pill done">Painted</span>`;
  if(r.ps.some(p=>ACTIVE.has(p.status))) return `<span class="pill active">Painting in progress</span>`;
  const nx = r.ps.filter(p=>p.month).sort((a,b)=>a.month.localeCompare(b.month))[0];
  if(r.ps.length) return `<span class="pill outline">Painting planned${nx?" · "+esc(monthLabel(nx.month).replace(/^(\w{3})\w*/,"$1")):""}</span>`;
  return `<span class="pill">No painting</span>`;
}

const LEARN_SEED = [];
const LEARN_CATS = ["Watercolor","Indian Folk Painting","International Folk","Online Subscriptions","Workshop Subscriptions","Non Painting Crafts","Drawing/Sketching","Websites","Books","Other resources","Challenges","Other"];
const LEARN_KINDS = [["free","Free"],["sub","Subscription"],["paid","Paid course"]];
function learnArr(){ return [...S.learning.values()].sort((a,b)=>(LEARN_CATS.indexOf(a.category)-LEARN_CATS.indexOf(b.category)) || String(a.name).localeCompare(String(b.name))); }
function saveLearn(x, delay){ x.updatedAt = nowISO(); S.learning.set(x.id, x); persist("learning/"+x.id, x, delay); }
function maybeSeedLearning(){
  if(!LEARN_SEED.length || S.mode!=="db" || !S.loaded.paintings || (S.settings.learningSeedV||0) >= 3) return;
  const blank = (cat,name,hl,url,id) => ({id, name, category:cat, kind:"", decision:"", highlighted:!!hl, url:url||"", notes:"", subject:"", status:"", cost:"", billing:"", renews:"", accessEnds:"", createdAt:nowISO()});
  const key = (cat,name) => cat+"|"+String(name).toLowerCase().replace(/\s*\(2nd link\)/,"").replace(/[^a-z0-9Ѐ-ӿ]/g,"");
  // match existing items (from the first, screenshot-based list) so decisions are kept and links get filled in
  const pool = new Map(); for(const x of S.learning.values()){ const k = key(x.category,x.name); if(!pool.has(k)) pool.set(k, []); pool.get(k).push(x); }
  let added = 0, linked = 0;
  LEARN_SEED.forEach(([cat,name,hl,url],i) => {
    const arr = pool.get(key(cat,name));
    const x = arr && arr.shift();
    if(x){ let ch = false; if(url && !x.url){ x.url = url; linked++; ch = true; } if(x.name !== name && /\(2nd link\)$/.test(x.name)===false){ x.name = name; ch = true; } if(!!hl !== !!x.highlighted){ x.highlighted = !!hl; ch = true; } if(ch) saveLearn(x, 400); }
    else { saveLearn(blank(cat,name,hl,url,"L"+String(i+1).padStart(3,"0")+(S.learning.has("L"+String(i+1).padStart(3,"0"))?"b":"")), 400); added++; }
  });
  // New Masters Academy (NMA) is excluded at Anuprita's request; remove any copies she hasn't touched
  for(const x of [...S.learning.values()]){ if(/^(nma\b|new masters? academy)/i.test(x.name) && !x.decision && !x.notes){ S.learning.delete(x.id); persist("learning/"+x.id, null, 400); } }
  S.settings.learningSeedV = 3; S.settings.learningSeeded = S.settings.learningSeeded || nowISO(); saveSettings();
  logAct("learning", `Learning sources from the Art Platforms sheet: ${added} added${linked?`, ${linked} links filled in`:""}`);
}

const REC_ST = [["","Not done"],["w","Watched"],["d","Done"]];
const recVid = u => { const m = String(u).match(/(?:youtu\.be\/|v=|live\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : String(u).replace(/[?#].*$/,""); };
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|v=|live\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : ""; };
const watchUrl = u => ytId(u) ? "https://www.youtube.com/watch?v=" + ytId(u) : u;
function openVideo(u){ const w = window.open(watchUrl(u), "_blank"); if(w){ try{ w.opener = null; }catch(_){} } else location.href = watchUrl(u); }
const recKey = u => recVid(u).replace(/[^A-Za-z0-9_-]/g,"_").slice(-60);
// one list of recordings; a workshop recorded twice in the archive (same videos) is shown once
function recIndex(){
  if(recIndex.c) return recIndex.c;
  const seen = new Map(), works = [], all = [];
  for(const [id, s] of Object.entries(WS_SESSIONS)){
    const items = s.sessions.map(([label,url],i)=>({wid:id, i, label, url, key:recKey(url)}));
    const fresh = items.filter(x=>!seen.has(x.key));
    if(!fresh.length) continue;
    fresh.forEach(x=>seen.set(x.key, id));
    works.push({id, items:fresh}); all.push(...fresh);
  }
  return recIndex.c = {works, all, owner:seen};
}
function recTitle(id){ const w = IX.wsById.get(id); return w ? wsEff(w).title : ((WS_SESSIONS[id]||{}).title || id); }
function recArt(id){ const w = IX.wsById.get(id); return w ? (wsEff(w).art||"") : ""; }
function recStatus(url){ const k = recKey(url); const wid = recIndex().owner.get(k); if(!wid) return ""; const m = S.meta.get(metaKey("rec", wid)); return (m && m.s && m.s[k]) || ""; }
function setRecStatus(url, st){
  const k = recKey(url); const wid = recIndex().owner.get(k); if(!wid) return;
  const m = getMeta("rec", wid); const s = Object.assign({}, m.s||{}); if(st) s[k] = st; else delete s[k];
  saveMeta("rec", wid, {s});
}

const PRAC_KEY = "ips-practice";
function pracGet(){ try{ return JSON.parse(localStorage.getItem(PRAC_KEY)||"null"); }catch(_){ return null; } }
function pracSet(p){ try{ p ? localStorage.setItem(PRAC_KEY, JSON.stringify(p)) : localStorage.removeItem(PRAC_KEY); }catch(_){} }
function pracLeft(p){ return p && p.start ? Math.max(0, p.start + p.mins*60e3 - Date.now()) : null; }
const mmss = ms => { const s = Math.ceil(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
function pickRecording(mode, onlyWid){
  const R = recIndex(); let pool;
  if(onlyWid){ const w = R.works.find(w=>w.id===onlyWid) || {items:(WS_SESSIONS[onlyWid]||{sessions:[]}).sessions.map(([label,url],i)=>({wid:onlyWid,i,label,url,key:recKey(url)}))};
    const nd = w.items.filter(x=>recStatus(x.url)!=="d"); pool = nd.length ? [nd.find(x=>!recStatus(x.url)) || nd[0]] : w.items; }
  else if(mode==="next"){
    const started = R.works.filter(w=>w.items.some(x=>recStatus(x.url)) && w.items.some(x=>!recStatus(x.url)));
    pool = started.map(w=>w.items.find(x=>!recStatus(x.url)));
    if(!pool.length){ toast("No workshop started yet, so here's a surprise instead."); pool = R.all.filter(x=>!recStatus(x.url)); }
  } else pool = R.all.filter(x=>!recStatus(x.url));
  if(!pool.length) pool = R.all;
  const last = (pracGet()||{}).key; let x = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1 && x.key===last) x = pool[(pool.indexOf(x)+1)%pool.length];
  return x;
}

let pracAudio = null;
function pracChime(){ try{ const a = pracAudio || new (window.AudioContext||window.webkitAudioContext)(); [0,0.45,0.9].forEach((d,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=[660,880,990][i]; g.gain.setValueAtTime(0.0001,a.currentTime+d); g.gain.exponentialRampToValueAtTime(0.25,a.currentTime+d+0.03); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d+0.4); o.connect(g).connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+0.45); }); }catch(_){} try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(_){} }
function pracFinish(st){
  const p = pracGet(); if(!p) return;
  const mins = p.start ? Math.max(1, Math.round((Math.min(Date.now(), p.start+p.mins*60e3) - p.start)/60e3)) : 0;
  if(st) setRecStatus(p.url, st);
  if(mins) logAct("practice", `${mins} min with ${recTitle(p.wid)} · ${p.label}${st==="d"?" — painted along":st==="w"?" — watched":""}`, p.wid);
  pracSet(null); toast(st==="d"?"Marked done. Lovely work. 🎨":st==="w"?"Marked watched.":"Saved. Try another any time."); render();
}
setInterval(() => {
  const p = pracGet(); const bar = document.getElementById("pracbar");
  const left = pracLeft(p);
  if(p && p.start && left===0 && !p.chimed){ p.chimed = 1; pracSet(p); pracChime(); toast("30 minutes done. How did it go?", 6000); if(S.ui.tab==="home") render(); }
  document.querySelectorAll("[data-prac-left]").forEach(el => el.textContent = left==null ? "" : mmss(left));
  const show = p && p.start && S.ui.tab!=="home";
  if(show){ let b = bar; if(!b){ b = document.createElement("button"); b.id = "pracbar"; b.type = "button"; b.className = "pracbar"; document.body.appendChild(b); b.addEventListener("click", ()=>{ S.ui.tab="home"; S.ui.ws=null; render.keepScroll=false; render(); window.scrollTo(0,0); }); }
    b.textContent = left ? `🎨 ${mmss(left)} · ${recTitle(p.wid)}` : "🎨 Time's up — tap to finish"; b.hidden = false; }
  else if(bar) bar.hidden = true;
}, 1000);
document.addEventListener("click", e => {
  const t = e.target; let el;
  if((el = t.closest("[data-rec-st]"))){ e.preventDefault(); const u = el.dataset.recSt; const cur = recStatus(u); const nx = cur==="" ? "w" : cur==="w" ? "d" : ""; setRecStatus(u, nx);
    const tmp = document.createElement("div"); tmp.innerHTML = recStatusBtn(u); el.replaceWith(tmp.firstChild); if(!document.querySelector(".sheet")) scheduleRender(); return; }
  if((el = t.closest("[data-rec-f]"))){ S.ui.recF = el.dataset.recF; render.keepScroll=false; render(); return; }
  if((el = t.closest("[data-rec-more]"))){ const k="R:"+el.dataset.recMore; S.ui.openNotes.has(k)?S.ui.openNotes.delete(k):S.ui.openNotes.add(k); render(); return; }
  if((el = t.closest("[data-prac-mode]"))){ S.ui.pracMode = el.dataset.pracMode; const x = pickRecording(S.ui.pracMode); if(x) pracChoose(x); return; }
  if((el = t.closest("[data-prac-pick-in]"))){ e.preventDefault(); const x = pickRecording("", el.dataset.pracPickIn); if(x){ closeOverlay(); pracChoose(x); } return; }
  if(t.closest("[data-prac-pick]")){ const x = pickRecording(S.ui.pracMode||"any"); if(x) pracChoose(x); return; }
  if((el = t.closest("[data-prac-open]"))){ e.preventDefault(); const p = pracGet(); if(p){ openVideo(p.url); if(!p.start){ p.start = Date.now(); pracSet(p); setTimeout(render, 400); } } return; }
  if(t.closest("[data-prac-go]")){ e.preventDefault(); const p = pracGet(); if(p){ openVideo(p.url); p.start = Date.now(); pracSet(p); try{ pracAudio = pracAudio || new (window.AudioContext||window.webkitAudioContext)(); pracAudio.resume && pracAudio.resume(); }catch(_){} setTimeout(render, 400); } return; }
  if(t.closest("[data-prac-more]")){ const p = pracGet(); if(p){ if(!p.start) p.start = Date.now(); const left = pracLeft(p); p.mins = Math.ceil((Date.now() - p.start)/60e3) + Math.ceil(left/60e3) + 10; delete p.chimed; pracSet(p); render(); } return; }
  if(t.closest("[data-prac-stop]")){ e.preventDefault(); const p = pracGet(); if(p){ if(!p.start) p.start = Date.now(); p.mins = Math.max(0, (Date.now()-p.start)/60e3 - 0.001); p.chimed = 1; p.stopped = 1; pracSet(p); render(); } return; }
  if(t.closest("[data-prac-cancel]")){ pracSet(null); render(); return; }
  if((el = t.closest("[data-prac-end]"))){ pracFinish(el.dataset.pracEnd); return; }
});

function pigFamily(r){
  if(r.family){ const f = PFAM.find(x=>x[1]===r.family); if(f) return f[0]; }
  const fix = {k40630:"brown", manganese:"black", epcrimson:"red", "uPG-100":"yellow"}[r.invId || r.manualId]; if(fix) return fix;
  if(r.sourceType==="Metal") return "metal";
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(r.colour||""); if(!m) return "none";
  const [R,G,B] = [m[1],m[2],m[3]].map(x=>parseInt(x,16)/255), mx=Math.max(R,G,B), mn=Math.min(R,G,B), l=(mx+mn)/2, d=mx-mn;

  if(l>0.85) return "white";

  if((h<50 || h>=345) && sat<0.45 && l<0.5) return "brown";

function pigInfo(r){ const man = PM.data ? PM.data.pigments.find(x=>x.manualId===(r.manualId||r.relatesTo)) : null; return {lime: r.lime || (man&&man.lime) || "", react: (r.react&&r.react.length ? r.react : (man&&man.react)||[])}; }
function compatIssues(p){
  if(!PM.data) return []; const C = PM.data.compat; const out = [];
  const surf = S.surfaces.get(p.surfaceId); const fam = surf ? (surf.family||"") : "";
  const pigs = (p.pigmentIds||[]).map(id=>S.pigments.get(id)).filter(Boolean).map(r=>({r, ...pigInfo(r)}));
  const binds = (p.binderIds||[]).map(id=>S.binders.get(id)).filter(Boolean);
  const isLime = surf && (C.limeFamilies.includes(fam) || /lime|fresco|araish|kerala/i.test(surf.name||""));
  if(isLime){ const bad = pigs.filter(x=>x.lime==="no"); if(bad.length) out.push(["bad", `On a lime ground: ${bad.map(x=>x.r.name.split(" — ")[0]).join(", ")} ${bad.length>1?"are":"is"} not lime-safe. Use secco, in a binder over set plaster — not into wet lime.`]); }
  const ars = pigs.filter(x=>x.react.includes("arsenic-sulphide")), lc = pigs.filter(x=>x.react.includes("lead")||x.react.includes("copper"));
  if(ars.length && lc.length) out.push(["warn", `${ars.map(x=>x.r.name.split(" — ")[0]).join(", ")} blackens beside ${lc.map(x=>x.r.name.split(" — ")[0]).join(", ")}. Keep them in separate passages.`]);
  const flex = surf && C.flexFamilies.includes(fam) && !/thangka/i.test(surf.name||"");
  const prot = binds.filter(b=>b.family==="Protein" && /glue/i.test(b.name));
  if(flex && prot.length) out.push(["bad", `${prot.map(b=>b.name).join(", ")} on a rolled cloth ground (${surf.name}) looks right and cracks the first time the work is rolled. Use a gum — kaitha, tamarind or babool.`]);
  const res = binds.filter(b=>/^Resin coating/.test(b.family||""));
  if(res.length) out.push(["info", `${res.map(b=>b.name).join(", ")} is a coating, not a binder — it finishes the painting; it cannot bind pigment ground in water.`]);
  const gum = binds.filter(b=>b.family==="Gum exudate");
  if(gum.length && pigs.some(x=>/hingula|haritala|lajwarda|azurite|malachite|cinnabar|orpiment|lapis/i.test(x.r.name))) out.push(["info", "Mix the gum per pigment: coarse minerals (cinnabar, orpiment, lapis, azurite, malachite) need a stronger solution, about 1:6–1:8, than earths."]);
  return out;
}
