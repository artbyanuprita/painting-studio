<script>
/* Google Apps Script runtime for Indian Painting Studio.
   Provides the same window.claude.use("db"|"assets"|"downloads"|"user") interface the app expects,
   backed by the "Indian Painting Studio — Data" Google Sheet and the Indian Painting Studio Drive folder. */
(function(){
  const API_URL = window.STUDIO_API || "";
  const track = (fn) => { const key = fn + "#" + Math.random().toString(36).slice(2,6); (window.__gpending = window.__gpending || {})[key] = Date.now(); return () => { delete window.__gpending[key]; }; };
  const logErr = (fn, m) => { (window.__gerrors = window.__gerrors || []).push(fn + ": " + m); };
  const runGas = (fn, ...args) => new Promise((res, rej) => {
    const done = track(fn);
    const r = google.script.run.withSuccessHandler(x => { done(); res(x); }).withFailureHandler(e => { done(); logErr(fn, e && e.message || e); rej(normErr(e)); });
    r[fn].apply(r, args);
  });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function runApi(fn, ...args){
    let netTries = 0;
    for(let attempt = 0; attempt < 2; attempt++){
      const token = await window.__auth.token();
      const done = track(fn);
      let j;
      try{
        const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args, token}), redirect:"follow"});
        j = await r.json();
      }catch(e){
        done();
        // a weak phone signal or a slow Google start-up: wait and try again (every call here is safe to repeat)
        if(netTries < 3){ await sleep([1500, 4000, 8000][netTries++]); attempt--; continue; }
        logErr(fn, "network"); throw {code:"unavailable", message:"network"};
      }
      done();
      if(j.ok) return j.result;
      if(/^auth:/.test(j.error) && attempt === 0){ window.__auth.reset(j.error); continue; }
      if(/^not_allowed:/.test(j.error)){ window.__auth.reset(j.error); continue; }
      logErr(fn, j.error); throw normErr(j.error);
    }
    throw {code:"invalid_argument", message:"sign-in"};
  }
  const run = API_URL ? runApi : runGas;
  function normErr(e){
    const m = String(e && e.message || e || "");
    const code = /too_large/.test(m) ? "too_large" : /not_found/.test(m) ? "not_found" : /authoriz|permission|access denied|do not have/i.test(m) ? "invalid_argument" : "unavailable";
    return {code, message:m};
  }
  const b64ToBlob = (b64, mime) => { const s = atob(b64); const a = new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return new Blob([a], {type:mime||"application/octet-stream"}); };
  const blobToB64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(normErr("read failed")); fr.readAsDataURL(blob); });

  /* ---------------- db ---------------- */
  const store = new Map();                 // path -> {t, d}
  const subs = new Set();
  let lastNow = 0;
  const pendingPaths = new Set();
  const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  const inCol = (col, p) => p.startsWith(col + "/") && p.split("/").length === col.split("/").length + 1;
  const snapDoc = (path) => { const e = store.get(path); return {id:path.split("/").pop(), exists:!!e, data:()=>e ? clone(e.d) : undefined, metadata:{fromCache:false, hasPendingWrites:pendingPaths.has(path)}}; };
  let notifyTimer = null;
  const notify = () => { clearTimeout(notifyTimer); notifyTimer = setTimeout(() => { for(const s of subs){ try{ s(); }catch(e){ console.error(e); } } }, 10); };

  function colRef(col){ return {
    path: col,
    doc: (id) => docRef(col + "/" + id),
    onSnapshot(next){
      let prev = new Map(), done = false;
      const fire = () => {
        const docs = [...store.keys()].filter(p => inCol(col, p)).sort().map(snapDoc);
        const cur = new Map(docs.map(d => [d.id, JSON.stringify(store.get(col + "/" + d.id).d)]));
        const changes = [];
        for(const d of docs){ if(!prev.has(d.id)) changes.push({type:"added", doc:d}); else if(prev.get(d.id) !== cur.get(d.id)) changes.push({type:"modified", doc:d}); }
        for(const [id] of prev) if(!cur.has(id)) changes.push({type:"removed", doc:{id, exists:false, data:()=>undefined}});
        prev = cur;
        if(changes.length || !done){ done = true; next({docs, size:docs.length, empty:!docs.length, docChanges:()=>changes, metadata:{}}); }
      };
      setTimeout(fire, 0); subs.add(fire); return () => subs.delete(fire);
    },
    get: async () => ({docs:[...store.keys()].filter(p => inCol(col, p)).sort().map(snapDoc)})
  }; }

  /* writes are batched: every change made within 300 ms goes to the Sheet in one call */
  let queue = new Map(), qTimer = null;
  function enqueue(path, j){
    return new Promise((resolve, reject) => {
      const prev = queue.get(path);
      const waiters = prev ? prev.waiters : [];
      waiters.push({resolve, reject});
      queue.set(path, {j, waiters});
      pendingPaths.add(path);
      clearTimeout(qTimer); qTimer = setTimeout(flushQueue, 300);
    });
  }
  async function flushQueue(){
    const batch = queue; queue = new Map();
    if(!batch.size) return;
    const ops = [...batch].map(([p, o]) => ({p, j:o.j}));
    try{
      const r = await run("api_write", ops);
      ops.forEach((op, i) => { const e = store.get(op.p); if(e) e.t = Math.max(e.t||0, r.times[i]); else if(op.j == null) tomb.set(op.p, r.times[i]); });
      for(const [p, o] of batch){ if(!queue.has(p)) pendingPaths.delete(p); o.waiters.forEach(w => w.resolve()); }
    }catch(e){
      for(const [p, o] of batch){ if(!queue.has(p)) pendingPaths.delete(p); o.waiters.forEach(w => w.reject(e)); }
    }
  }
  const tomb = new Map();
  function docRef(path){ return {
    path, id: path.split("/").pop(),
    get: async () => snapDoc(path),
    set: async (d) => { const j = JSON.stringify(d); store.set(path, {t:(store.get(path)||{}).t||0, d:JSON.parse(j)}); notify(); return enqueue(path, j); },
    update: async (d) => { const cur = (store.get(path)||{}).d || {}; return docRef(path).set(Object.assign({}, cur, d)); },
    delete: async () => { store.delete(path); notify(); return enqueue(path, null); },
    onSnapshot(next){ let prev, done = false; const fire = () => { const e = store.get(path); const j = e ? JSON.stringify(e.d) : ""; if(j !== prev || !done){ done = true; prev = j; next(snapDoc(path)); } }; setTimeout(fire, 0); subs.add(fire); return () => subs.delete(fire); }
  }; }

  function applyRows(rows){
    let changed = false;
    for(const [p, t, j] of rows){
      if(pendingPaths.has(p)) continue;
      const cur = store.get(p);
      if(cur && cur.t >= t) continue;
      if(!cur && tomb.has(p) && tomb.get(p) >= t) continue;
      if(j == null){ if(cur){ store.delete(p); tomb.set(p, t); changed = true; } continue; }
      try{ store.set(p, {t, d:JSON.parse(j)}); changed = true; }catch(e){ console.warn("bad row", p); }
    }
    if(changed) notify();
  }
  let polling = false, pollTimer = null;
  async function poll(){
    if(polling) return; polling = true;
    try{ const r = await run("api_since", Math.max(0, lastNow - 10000)); lastNow = r.now; applyRows(r.docs); setSync("ok"); }
    catch(e){ setSync("offline"); }
    finally{ polling = false; }
  }
  function schedulePoll(){ clearInterval(pollTimer); pollTimer = setInterval(() => { if(document.visibilityState === "visible") poll(); }, 20000); }
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") poll(); });
  window.addEventListener("focus", () => poll());
  function setSync(s){ document.documentElement.dataset.gsync = s; }

  async function loadAll(){
    for(let i = 0; ; i++){
      try{ return await run("api_all"); }
      catch(e){ if(e && e.code !== "unavailable") throw e; setSync("offline"); if(i >= 8) throw e; await sleep(5000); }
    }
  }
  const ready = loadAll().then(r => { lastNow = r.now; for(const [p, t, j] of r.docs){ try{ store.set(p, {t, d:JSON.parse(j)}); }catch(e){} } schedulePoll(); setSync("ok"); return true; });
  const db = {doc: docRef, collection: colRef};

  /* ---------------- photos ---------------- */
  const photoCache = new Map();
  function photoURL(id){
    if(!photoCache.has(id)) photoCache.set(id, run("api_getPhoto", id).then(r => URL.createObjectURL(b64ToBlob(r.b64, r.mime))).catch(e => { photoCache.delete(id); throw e; }));
    return photoCache.get(id);
  }
  function fixImg(img){
    const s = img.getAttribute("src") || ""; const m = /^\/?_blob\/(.+)$/.exec(s); if(!m) return;
    const id = m[1]; img.dataset.gid = id; img.removeAttribute("src");
    photoURL(id).then(u => { if(img.dataset.gid === id) img.src = u; }).catch(() => { img.alt = "Photo unavailable"; });
  }
  new MutationObserver(muts => {
    for(const m of muts){
      if(m.type === "attributes"){ if(m.target.tagName === "IMG") fixImg(m.target); continue; }
      m.addedNodes.forEach(n => { if(n.nodeType !== 1) return; if(n.tagName === "IMG") fixImg(n); if(n.querySelectorAll) n.querySelectorAll('img[src*="_blob/"]').forEach(fixImg); });
    }
  }).observe(document.documentElement, {childList:true, subtree:true, attributes:true, attributeFilter:["src"]});

  const assets = {
    upload: async (blob, o) => {
      o = o || {};
      if(blob.size > 20e6) throw {code:"too_large"};
      const mime = o.type || blob.type || "image/jpeg";
      const b64 = await blobToB64(blob);
      const r = await run("api_putPhoto", b64, mime, {pid:o.pid||"", kind:o.kind||"", chapter:o.chapter||"", date:o.date||""});
      photoCache.set(r.id, Promise.resolve(URL.createObjectURL(blob)));
      return {id:r.id, url:"/_blob/"+r.id, sizeBytes:blob.size, contentType:mime};
    },
    list: async () => ({assets:[], usage:{}}),
    delete: async (id) => { await run("api_trashPhoto", id); photoCache.delete(id); return {deleted:true}; }
  };

  /* ---------------- downloads → Google Drive ---------------- */
  const downloads = {
    save: async ({filename, data}) => {
      const blob = data instanceof Blob ? data : new Blob([String(data)], {type: /\.json$/i.test(filename) ? "application/json" : /\.csv$/i.test(filename) ? "text/csv" : /\.html?$/i.test(filename) ? "text/html" : "text/plain"});
      const r = await run("api_saveFile", filename, await blobToB64(blob), blob.type);
      setTimeout(() => { try{ window.__studio.toast("Saved to Google Drive › Indian Painting Studio › " + r.folder, 6000); }catch(e){} }, 80);
      return {status:"saved"};
    }
  };

  /* ---------------- reference files from Drive "App data" ---------------- */
  const ofetch = window.fetch.bind(window);
  window.fetch = async (input, opts) => {
    const u = String(input && input.url || input);
    let m;
    if((m = /^\/?_blob\/(.+)$/.exec(u))){
      try{ const r = await run("api_getPhoto", m[1]); return new Response(b64ToBlob(r.b64, r.mime), {status:200}); }catch(e){ return new Response("", {status:404}); }
    }
    if(/^data\//.test(u)){
      // reference files (themes, workshops…) are kept on this device and refreshed once a day, so later opens are instant
      const name = u.slice(5); let cache = null, hit = null;
      try{ cache = await caches.open("studio-ref-v2"); hit = await cache.match("/ref/" + name); }catch(e){}
      const fresh = async () => { const r = await run("api_getFile", name); const resp = new Response(r.text != null ? r.text : b64ToBlob(r.b64, r.mime), {status:200, headers:{"Content-Type":r.mime, "X-Saved":String(Date.now())}}); try{ if(cache) await cache.put("/ref/" + name, resp.clone()); }catch(e){} return resp; };
      // the manuals change more often: re-check them in the background whenever the cached copy is over 10 minutes old
      if(hit){ const age = Date.now() - Number(hit.headers.get("X-Saved") || 0); if(age > (/pigments-manual/.test(name) ? 6e5 : 864e5)) fresh().catch(()=>{}); return hit; }
      try{ return await fresh(); }
      catch(e){ console.warn("data file", u, e); return new Response("", {status:404}); }
    }
    return ofetch(input, opts);
  };

  /* ---------------- user ---------------- */
  const hello = run("api_hello").catch(() => ({email:"", owner:""}));
  const user = { can: async () => true, isOwner: async () => { const h = await hello; return !!h.email && h.email === h.owner; }, id: async () => (await hello).email || "me" };

  /* external links open in a new tab (the app runs inside Google's frame) */
  document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[href]"); if(!a) return; const h = a.getAttribute("href")||""; if(/^https?:/i.test(h) && !a.target){ a.target = "_blank"; a.rel = "noopener"; } }, true);

  window.claude = { use: async (n) => {
    if(n === "db"){ try{ await ready; return db; }catch(e){ console.error("studio data", e); return null; } }
    return ({assets, downloads, user})[n] || null;
  } };
  window.__gstudio = {poll, store, flush: flushQueue};
})();

</script>
<script>
(function(){
"use strict";
/* ============================================================ constants */
const STATUSES = ["Not Started","Researching","Preparing Materials","Sketching","Painting","Finishing","Documenting","Completed","Deferred"];
const ACTIVE = new Set(["Researching","Preparing Materials","Sketching","Painting","Finishing","Documenting"]);
const DEFAULT_STAGES = ["Theme and reference research","Teacher/reference study","Surface and pigment preparation","Initial drawing/sketch","Main painting execution","Detailing and finishing","Photography and documentation","Final review and archive"];
const IDEA_STATUSES = ["New","Researching","Shortlisted","Scheduled","Archived"];
const PRIORITIES = ["High","Medium","Low"];
const RES_TYPES = ["Book","PDF","Article","Museum reference","Artist website","Tutorial video","Notes","Other"];
const STD_CATS = ["","Folk","Tribal","Miniature","Scroll","Mural","Floor","Manuscript","Textile / surface","Other"];
const WEEKS = ["Week 1","Week 2","Week 3","Week 4","Weeks 1–4"];
const TABS = [["home","Home"],["calendar","Calendar"],["paintings","Paintings"],["tasks","Tasks"],["ideas","Idea Bank"],["themes","Theme Reference"],["workshops","Workshops"],["library","Library"],["portfolio","Portfolio"],["book","Book"],["learn","Courses & classes"],["subs","Subscriptions"],["outreach","Outreach"],["review","Review"],["deferred","Deferred"],["settings","Settings"]];
const MONTHN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SCHEMA = 1;

/* ============================================================ colour theme (per device) */
const PALETTES = [["sindoor","Sindoor & Peacock","Vermilion with peacock blue",["#F6FAFA","#B92F1A","#0D5A63","#FDE3DC"]],["haldi","Haldi & Neel","Turmeric with indigo",["#FFFBEC","#2F3B9A","#F7D774","#1E2765"]],["lotus","Hingula & Leaf","Cinnabar red with leaf green",["#FFFAF5","#C2381F","#1C5C3A","#FDE9E1"]],["earth","Earth","The original geru and ivory",["#F3ECE1","#8F3B24","#2B2522","#F1DDD2"]]];
function getPalette(){ try{ return localStorage.getItem("ips-palette") || "sindoor"; }catch(e){ return "sindoor"; } }
function applyPalette(k){ if(k==="earth") document.documentElement.removeAttribute("data-palette"); else document.documentElement.setAttribute("data-palette", k); }
applyPalette(getPalette());
/* ============================================================ library record kinds (user-entered only) */
const KINDS = {
  pigments:{title:"Pigment", plural:"Pigments", map:()=>S.pigments, field:"pigmentIds", fields:[
    ["name","Name","text",{req:1,ph:"e.g. Hingula, Geru, Neel"}],["altNames","Other names","text"],["colour","Swatch colour","color"],
    ["sourceType","Source type","select",["","Mineral","Plant","Earth / ochre","Animal","Soot / carbon","Metal","Other"]],
    ["source","What it is made from","text"],["obtained","Where you get it","text",{ph:"gathered, bought, supplier"}],
    ["binder","Binder","text",{ph:"e.g. gum, tamarind seed glue"}],["preparation","How you prepare it","textarea"],
    ["traditions","Traditions that use it","text"],["handling","Handling and lightfastness notes","textarea"],["safety","Safety notes","textarea"],["notes","Notes","textarea"]]},
  surfaces:{title:"Surface", plural:"Surfaces", map:()=>S.surfaces, field:"surfaceId", fields:[
    ["name","Name","text",{req:1,ph:"e.g. Pattachitra cloth, Sanganeri handmade paper"}],
    ["surfaceType","Surface type","select",["","Cloth","Handmade paper","Paper","Palm leaf","Wood","Wall / plaster","Glass","Leather","Other"]],
    ["base","Base material","text"],["tradition","Tradition / GI region","text"],["layers","Ground and coating layers","textarea"],
    ["preparation","Preparation steps","textarea"],["curing","Drying and curing","textarea"],["finishing","Finishing (e.g. burnishing)","textarea"],
    ["sources","Where you get the materials","text"],["notes","Notes","textarea"]]}
};
function recUsedBy(kind, id){ const f = KINDS[kind].field; return paintingsArr().filter(p => Array.isArray(p[f]) ? p[f].includes(id) : p[f]===id); }
function recordsView(kind){
  const K = KINDS[kind]; const q = norm(S.ui.libQ);
  const all = [...K.map().values()].sort((a,c)=>norm(a.name).localeCompare(norm(c.name)));
  const list = all.filter(r=>!q || norm(Object.values(r).join(" ")).includes(q));
  const intro = kind==="pigments" ? "Record each natural pigment once, then pick it in a painting's Materials section. Nothing is pre-filled; the library holds only what you enter."
    : "Record each canvas or ground you prepare, then choose it in a painting's Materials section. Nothing is pre-filled.";
  return `<div class="row between"><input class="in grow" type="search" data-ui="libQ" value="${attr(S.ui.libQ)}" placeholder="Search ${K.plural.toLowerCase()}" aria-label="Search" style="max-width:420px"><button class="btn primary" data-act="rec-new" data-kind="${kind}">${ICON.plus} New ${K.title.toLowerCase()}</button></div>
    <div class="small muted">${intro}</div>
    ${list.length?`<div class="recgrid">${list.map(r=>{ const used=recUsedBy(kind,r.id).length; return `<button class="card rec" data-act="rec-edit" data-kind="${kind}" data-id="${attr(r.id)}">${kind==="pigments"?`<span class="sw" style="background:${/^#[0-9a-f]{6}$/i.test(r.colour||"")?r.colour:"transparent"}"></span>`:""}<span class="grow" style="min-width:0"><b>${esc(r.name)}</b><br><span class="small muted">${esc([r.sourceType||r.surfaceType, r.source||r.base, r.tradition||r.traditions].filter(Boolean).join(" · "))||"—"}</span><br><span class="tiny ink2">${used?`Used in ${used} painting${used>1?"s":""}`:"Not used yet"}</span></span></button>`; }).join("")}</div>`
      : `<div class="empty">${all.length?"Nothing matches.":`No ${K.plural.toLowerCase()} yet. Tap “New ${K.title.toLowerCase()}” to add your first.`}</div>`}`;
}
/* ============================================================ state */
const S = {
  db:null, assets:null, downloads:null, user:null, canWrite:true, ready:false, mode:"connecting",
  settings:{periodStart:"2026-11", months:12, monthlyTarget:10, defaultStages:DEFAULT_STAGES.slice(), schemaVersion:SCHEMA},
  paintings:new Map(), tasks:new Map(), ideas:new Map(), meta:new Map(), resources:new Map(), activity:new Map(), pigments:new Map(), surfaces:new Map(), binders:new Map(), outreach:new Map(), venues:new Map(), ifam:new Map(), journals:new Map(), learning:new Map(),
  ref:{themes:null, workshops:null, artforms:null, resources:null, seed:null, report:null},
  loaded:{paintings:false},
  ui:{tab:"home", ws:null, wsSec:"overview", calMonth:null, calView:"weeks", pq:"", pf:{status:"",month:"",trad:"",size:""},
      themeCat:null, themeGroup:null, themeQ:"", themeArt:"", themeFavs:false, openNotes:new Set(),
      wsub:"records", wq:"", wf:{art:"",teacher:"",prov:"",type:"",review:""}, wlimit:25,
      lib:"artforms", libQ:"", resOpen:new Set(), ideaF:"", taskShowDone:false, rv:{year:"",month:"",trad:""}, searchQ:""}
};

/* ============================================================ utils */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr = esc;
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowISO = () => new Date().toISOString();

/* ============================================================ persistence */
const saveQ = new Map();   // path -> {timer, running, pending}
let saveErrors = 0, saving = 0;
function setSaveState(){
  const b = $("#savestate"); let s="saved", t="All changes saved";
  if(S.mode==="local"){ s="local"; t="Not saving — sign in to keep changes"; }
  else if(S.mode==="connecting"){ s="saving"; t="Connecting…"; }
  else if(saveErrors){ s="error"; t="Not saved — tap to retry"; }
  else if(saving || [...saveQ.values()].some(q=>q.pending)){ s="saving"; t="Saving…"; }
  b.dataset.s = s; b.querySelector("span").textContent = t;
}
function persist(path, body, delay=500){
  if(S.mode==="local" || !S.db){ setSaveState(); return; }
  let q = saveQ.get(path); if(!q){ q={timer:null,running:false,pending:null}; saveQ.set(path,q); }
  q.pending = body === null ? {__delete:true} : JSON.parse(JSON.stringify(body));
  clearTimeout(q.timer); q.timer = setTimeout(()=>flush(path), delay); setSaveState();
}
async function flush(path){
  const q = saveQ.get(path); if(!q || q.running || !q.pending) return;
  const body = q.pending; q.pending = null; q.running = true; saving++; setSaveState();
  let ok = false;
  for(let attempt=0; attempt<2 && !ok; attempt++){
    try{
      const ref = S.db.doc(path);
      if(body.__delete) await ref.delete(); else await ref.set(body);
      ok = true;
    }catch(e){
      if(e && e.code==="unavailable" && attempt===0){ await new Promise(r=>setTimeout(r, 400+Math.random()*600)); continue; }
      console.error("save failed", path, e);
      q.failed = body; saveErrors++;
      const msg = e && e.code==="quota_exceeded" ? "Storage is full — export a backup and remove unused records." :
                  e && e.code==="invalid_argument" ? "This change could not be saved (you may have view-only access)." : "A change did not save. Tap the red status to retry.";
      toast(msg, 5000); break;
    }
  }
  if(ok && q.failed){ q.failed = null; }
  saving--; q.running = false;
  if(q.pending) flush(path);
  setSaveState();
}
function retryFailed(){
  saveErrors = 0;
  for(const [path,q] of saveQ){ if(q.failed){ q.pending = q.pending || q.failed; q.failed=null; flush(path); } }
  setSaveState();
}
window.addEventListener("beforeunload", e => { if(saving || [...saveQ.values()].some(q=>q.pending)){ e.preventDefault(); e.returnValue=""; } });

async function boot(){
  const tabsEl = $("#tabs");
  const h = (location.hash||"").slice(1); if(TABS.some(t=>t[0]===h) || h==="search") S.ui.tab = h;
  drawTabs();

  Object.assign(S.ref, {themes, workshops, artforms, resources, seed, report});
  addExtraWorkshops(S.ref.workshops);
  indexRef();
  render();
  // if a reference file didn't arrive (weak signal), try again quietly
  const missing = () => ["themes","workshops","artforms","resources","seed","report"].filter(k=>!S.ref[k]);
  const retryRefs = async (n) => { const m = missing(); if(!m.length || n > 4) return; await new Promise(r=>setTimeout(r, 6000*n));
    const got = await Promise.all(m.map(k=>loadRef(k==="seed"?"paintings-seed":k==="report"?"import-report":k)));
    m.forEach((k,i)=>{ if(got[i]) S.ref[k] = got[i]; }); addExtraWorkshops(S.ref.workshops); IX.themes.clear(); IX.themeList.length=0; IX.wsById.clear(); IX.wsList.length=0; IX.afById.clear(); IX.resById.clear(); indexRef(); render(); retryRefs(n+1); };

function subscribe(){
  const db = S.db; let first = {p:false,c:false};
  const fail = e => { console.error(e); if(e && e.code==="revoked"){ S.mode="local"; setSaveState(); } };
  db.collection("paintings").onSnapshot(snap => {
    for(const ch of snap.docChanges()){
      if(ch.type==="removed") S.paintings.delete(ch.doc.id);
      else if(!isPending("paintings/"+ch.doc.id)) S.paintings.set(ch.doc.id, normPainting(structuredClone(ch.doc.data())));
    }

  }, fail);
  const simple = (col, map) => db.collection(col).onSnapshot(snap => {

      else if(!isPending(col+"/"+ch.doc.id)) map.set(ch.doc.id, structuredClone(ch.doc.data()));
    }

  }, fail);

  }, fail);
}

  $("#periodband").innerHTML = `<div><span class="cap">Studio planning period</span><strong>${esc(monthLabel(m[0]))} – ${esc(monthLabel(m[m.length-1]))}</strong></div><button class="btn sm" type="button" data-act="new-painting">${ICON.plus} New painting</button>`;
}
function go(tab, opts={}){
  S.ui.tab = tab; S.ui.ws = opts.ws || null; S.ui.journal = null; if(opts.sec) S.ui.wsSec = opts.sec;
  try{ history.pushState({tab, ws:S.ui.ws, sec:S.ui.wsSec}, "", "#"+tab); }catch(e){}
  render.keepScroll = false; render(); window.scrollTo(0,0);
  const t = document.querySelector(`#tabs [data-tab="${tab}"]`); if(t) t.scrollIntoView({inline:"nearest", block:"nearest"});
}
function openWs(id, sec){ go(S.ui.tab==="search" ? "paintings" : S.ui.tab, {ws:id, sec:sec||"overview"}); }
window.addEventListener("popstate", e => { const st = e.state || {}; closeOverlay(); S.ui.tab = st.tab || (location.hash.slice(1)||"home"); S.ui.ws = st.ws || null; if(st.sec) S.ui.wsSec = st.sec; render.keepScroll=false; render(); });
try{ history.replaceState({tab:S.ui.tab}, "", location.hash || "#home"); }catch(e){}

/* ============================================================ shared fragments */
function paintingRow(p, opts={}){
  const pr = pProgress(p);
  const meta = [p.id, p.artForm, p.month ? monthLabel(p.month) : "Unscheduled", p.week].filter(Boolean).join(" · ");
  const sub = [p.dimensions, `${fmtHours(pHours(p))} hours`, p.teacher].filter(Boolean).join(" · ");
  return `<div class="prow">
    <div class="stack-s" style="min-width:0;gap:3px">
      <div class="row" style="gap:6px"><button class="bt t" data-act="open-ws" data-id="${attr(p.id)}">${esc(p.title)}</button>${p.draft?'<span class="pill outline">Draft</span>':''}${isOverdue(p)?'<span class="pill bad">Overdue</span>':''}</div>
      <div class="small muted clip">${esc(meta)}${p.dimensions?" · "+esc(p.dimensions):""}</div>
      <div class="row small" style="gap:8px">${statusPill(p.status)}<div class="bar rbar" style="width:70px;flex:none"><i style="width:${pr.pct}%"></i></div><span class="muted num">${pr.d}/${pr.n} · ${fmtHours(pHours(p))} h</span></div>
      ${opts.extra||""}

  </div>`;
}
function sel(name, opts, val, extra=""){ return `<select class="in" ${name} ${extra}>${opts.map(o=>{ const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${attr(v)}"${String(v)===String(val??"")?" selected":""}>${esc(l)}</option>`; }).join("")}</select>`; }
function monthOptions(includeBlank=true){ const set = new Set(periodMonths()); for(const p of S.paintings.values()) if(p.month) set.add(p.month); const arr=[...set].sort(); return (includeBlank?[["","Unscheduled"]]:[]).concat(arr.map(m=>[m, monthLabel(m)])); }
function pf(p, k, label, type="text", extra=""){ // painting field
  const v = p[k] ?? "";
  if(type==="textarea") return `<label class="f full"><span>${esc(label)}</span><textarea class="in" data-pf="${attr(p.id)}" data-k="${k}" ${extra}>${esc(v)}</textarea></label>`;
  return `<label class="f"><span>${esc(label)}</span><input class="in" type="${type}" data-pf="${attr(p.id)}" data-k="${k}" value="${attr(v)}" ${extra}></label>`;
}
function searchBtns(imgQuery, ytQuery){ return `<a class="btn sm" href="${attr(imgQ(imgQuery))}" target="_blank" rel="noopener" title="${attr(imgQuery)}">${ICON.img} Reference images</a><a class="btn sm" href="${attr(ytQ(ytQuery))}" target="_blank" rel="noopener" title="${attr(ytQuery)}">${ICON.yt} YouTube</a>`; }
function pImgQuery(p){ return `${p.title} ${p.tradition||p.artForm} painting traditional art reference`.replace(/\s+/g," ").trim(); }
function pYtQuery(p){ return `${p.title} ${(p.artForm||p.tradition).replace(/\//g," ")} painting tutorial`.replace(/\s+/g," ").trim(); }

/* ============================================================ HOME */
function computeStats(){
  const ps = [...S.paintings.values()];
  const planned = ps.filter(p => inPeriod(p) && p.status!=="Deferred");
  const done = planned.filter(p => p.status==="Completed").length;
  const active = ps.filter(p => ACTIVE.has(p.status)).length;
  const hours = ps.reduce((a,p)=>a+pHours(p),0);
  return {planned:planned.length, done, active, hours, pct: planned.length? Math.round(done*100/planned.length):0, ws: IX.wsList.length};
}

  let backupDue = false; try{ const last = S.settings.lastBackupAt; const snooze = localStorage.getItem("ips-backup-snooze")||""; backupDue = S.paintings.size>0 && (!last || (Date.now()-Date.parse(last))>30*864e5) && !(snooze && snooze>todayISO()); }catch(_){ }

  <div class="grid2">

      ${resumeCard}
      ${running.length? `<div class="list" style="margin-bottom:8px">${running.map(p=>`<div class="item"><div class="grow"><div class="t">${esc(p.title)}</div><div class="small muted">${esc(p.id)} · timer running since ${esc(new Date(p.timer.start).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}</div></div>${timerBtn(p)}</div>`).join("")}</div>`:""}
      ${todaySessions.length? `<div class="small ink2" style="margin-bottom:6px">${todaySessions.length} session${todaySessions.length>1?"s":""} logged today · ${fmtHours(todaySessions.reduce((a,x)=>a+(+x.s.hours||0),0))} h</div>`:""}
      ${todayTasks.length ? `<div class="list">${todayTasks.map(taskLine).join("")}</div>` : `<div class="small muted">No tasks due today.</div>`}
      ${activeP.length ? `<div class="cap" style="margin-top:12px">On the easel</div><div class="list">${activeP.slice(0,4).map(p=>`<div class="item click" data-act="open-ws" data-id="${attr(p.id)}"><div class="grow"><div class="t">${esc(p.title)}</div><div class="small muted">${esc(p.id)} · ${esc(p.status)} · ${pProgress(p).pct}%</div></div></div>`).join("")}</div>`:""}
    </div></section>
    <section class="panel"><div class="hd"><h2>This week</h2><span class="small muted">${before? "Planning starts "+esc(monthLabel(curMonth)) : esc(monthLabel(curMonth))+" · Week "+curWeek}</span></div><div class="bd">

    </div></section>

  <section class="panel"><div class="hd"><h2>Monthly progress</h2><span class="legend"><span><i style="background:var(--rust)"></i>Completed</span><span><i style="background:var(--track)"></i>Planned</span></span></div><div class="bd">${monthBars()}</div></section>

};
function actLine(a){ return `<div class="item${a.ref&&S.paintings.has(a.ref)?" click":""}" ${a.ref&&S.paintings.has(a.ref)?`data-act="open-ws" data-id="${attr(a.ref)}"`:""}><div class="grow"><div>${esc(a.text)}</div><div class="tiny muted">${esc(new Date(a.t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}))}</div></div></div>`; }
function monthBars(filterTrad){
  const ms = periodMonths(); const ps=[...S.paintings.values()].filter(p=>!filterTrad || p.tradition===filterTrad || p.artForm===filterTrad);

/* ============================================================ CALENDAR */
VIEWS.calendar = function(){
  const ms = periodMonths(); const ps = paintingsArr();
  if(!S.ui.calMonth || !ms.includes(S.ui.calMonth)){ const t = todayISO().slice(0,7); S.ui.calMonth = ms.includes(t) ? t : ms[0]; }
  const m = S.ui.calMonth; const inM = ps.filter(p=>p.month===m);
  const mstat = k => { const act=ps.filter(p=>p.month===k && p.status!=="Deferred"); return {n:act.length, d:act.filter(p=>p.status==="Completed").length}; };
  const idx = ms.indexOf(m);
  const strip = ms.map(k=>{ const s=mstat(k); return `<button class="seg" type="button" data-cal-month="${k}" data-drop-month="${k}" aria-pressed="${k===m}" title="${attr(monthLabel(k))}: ${s.d} of ${s.n} completed"><span class="segbar"><i style="height:${s.n?s.d*100/s.n:0}%"></i></span><span class="seglb">${MONTHN[+k.slice(5)-1].slice(0,3)}</span></button>`; }).join("");
  const cards = `<div class="calbar"><button class="icon-btn" data-cal-step="-1" aria-label="Previous month" ${idx<=0?"disabled":""}>${ICON.back}</button>
    <select class="in calsel" data-cal-select aria-label="Choose month">${ms.map(k=>{ const s=mstat(k); return `<option value="${k}"${k===m?" selected":""}>${esc(monthLabel(k))} · ${s.d}/${s.n} done</option>`; }).join("")}</select>
    <button class="icon-btn" data-cal-step="1" aria-label="Next month" ${idx>=ms.length-1?"disabled":""} style="transform:scaleX(-1)">${ICON.back}</button></div>
    <div class="strip${S.ui.moving?" moving":""}">${strip}</div>`;
  const counts = {planned:inM.filter(p=>p.status==="Not Started").length, active:inM.filter(p=>ACTIVE.has(p.status)).length, done:inM.filter(p=>p.status==="Completed").length, deferred:inM.filter(p=>p.status==="Deferred").length};
  let body;
  if(S.ui.calView==="weeks"){
    const multi = inM.filter(p=>p.week==="Weeks 1–4" || !WEEKS.includes(p.week));
    const td = todayISO(); const curW = td.slice(0,7)===m ? "Week "+currentWeek(td) : "Week 1";
    const mv = S.ui.moving && S.paintings.get(S.ui.moving);
    const moveBar = mv ? `<div class="movebar"><span>Moving <b>${esc(mv.id)} ${esc(mv.title)}</b>. Tap “Move here” on a week, or a month in the strip above.</span><button class="btn sm" data-act="move-cancel">Cancel</button></div>` : "";
    const board = `<div class="board">${multi.length||mv?`<div class="bcol bmulti" data-drop-week="Weeks 1–4"><div class="bhd"><h3>Multi-week (Weeks 1–4)</h3><span class="small muted">${fmtDate(weekRange(m,"Weeks 1–4").start)} – ${fmtDate(weekRange(m,"Weeks 1–4").end)}</span></div>${mv && !(mv.month===m && mv.week==="Weeks 1–4")?`<button class="btn sm primary movehere" data-move-week="Weeks 1–4" style="max-width:260px">Move here (whole month)</button>`:""}<div class="bcards">${multi.map(boardCard).join("")}</div></div>`:""}
      ${WEEKS.slice(0,4).map(w=>{ const r=weekRange(m,w); const list=inM.filter(p=>p.week===w); return `<div class="bcol" data-drop-week="${w}"><div class="bhd"><h3>${esc(w)}</h3><span class="small muted">${fmtDate(r.start).replace(/,? \d{4}$/,"")} – ${fmtDate(r.end).replace(/,? \d{4}$/,"")}</span></div>${mv && !(mv.month===m && mv.week===w)?`<button class="btn sm primary movehere" data-move-week="${w}">Move here</button>`:""}<div class="bcards">${list.map(boardCard).join("") || `<div class="small muted bempty">Drop a painting here</div>`}</div></div>`; }).join("")}</div>
      <div class="small muted boardhint">Tap Move on a card, then a week or a month in the strip. With a mouse you can also drag cards. Each move is recorded in the painting's schedule history.</div>`;
    body = `<div class="weekboard">${moveBar}${board}</div><div class="weeklist">` + WEEKS.map(w => { const list = inM.filter(p=>p.week===w); const r = weekRange(m,w);
      const other = w==="Weeks 1–4" ? inM.filter(p=>!WEEKS.includes(p.week)) : [];
      const all = list.concat(other); if(!all.length && w==="Weeks 1–4") return "";
      const open = curW===w || (w==="Weeks 1–4" && curW==="Week 1");
      return `<details class="wk"${open?" open":""}><summary class="weekhd"><h3>${w==="Weeks 1–4"?"Multi-week":esc(w)} <span class="muted small num">${all.length}</span></h3><span class="small muted">${fmtDate(r.start).replace(/,? \d{4}$/,"")} – ${fmtDate(r.end).replace(/,? \d{4}$/,"")}</span></summary>
        ${all.length? `<div class="list">${all.map(p=>paintingRow(p)).join("")}</div>` : `<div class="small muted" style="padding:10px 0">No paintings planned this week.</div>`}</details>`; }).join("") + `</div>`;
  } else body = inM.length ? `<div class="list">${inM.map(p=>paintingRow(p)).join("")}</div>` : `<div class="empty">No paintings planned for this month.</div>`;
  const unsched = ps.filter(p=>!p.month || !ms.includes(p.month));
  return `<div class="stack">
    <div class="stack-s">${cards}</div>
    <section class="panel" data-nofold><div class="hd"><h2>${esc(monthLabel(m))}</h2>
      <div class="chips"><button class="chip" data-cal-view="weeks" aria-pressed="${S.ui.calView==="weeks"}">By week</button><button class="chip" data-cal-view="list" aria-pressed="${S.ui.calView==="list"}">List</button></div></div>
      <div class="bd"><div class="row small" style="margin-bottom:6px"><span class="pill">${counts.planned} planned</span><span class="pill active">${counts.active} active</span><span class="pill done">${counts.done} completed</span><span class="pill deferred">${counts.deferred} deferred</span></div>${body}</div></section>
    ${unsched.length? `<section class="panel"><div class="hd"><h2>Unscheduled drafts</h2><span class="small muted">${unsched.length}</span></div><div class="bd"><div class="list">${unsched.map(p=>paintingRow(p)).join("")}</div></div></section>`:""}
  </div>`;
};

  return `<div class="bcard${S.ui.moving===p.id?" moving-src":""}" draggable="true" data-drag="${attr(p.id)}">
    <button class="bt" data-act="open-ws" data-id="${attr(p.id)}">${esc(p.title)}</button>
    <div class="tiny muted clip">${esc(p.id)} · ${esc(p.artForm)}${p.dimensions?" · "+esc(p.dimensions):""}</div>

/* ============================================================ PAINTINGS */
VIEWS.paintings = function(){
  const f = S.ui.pf; const q = norm(S.ui.pq);
  const all = paintingsArr();
  const trads = [...new Set(all.map(p=>p.tradition).filter(Boolean))].sort();
  const list = all.filter(p => (!f.status || p.status===f.status) && (!f.month || (f.month==="none" ? !p.month : p.month===f.month)) && (!f.trad || p.tradition===f.trad) && (!f.size || p.sizeClass===f.size) &&
    (!q || norm([p.id,p.title,p.artForm,p.tradition,p.subtradition,p.theme,p.subject,p.teacher,p.platform,p.notes,p.researchNotes,p.processNotes].join(" ")).includes(q)));
  const grouped = !q && !Object.values(f).some(Boolean);
  let groupedHtml = "";
  if(grouped){
    const keys = [...new Set(list.map(p=>p.month||""))].sort((a,c)=>(a||"9999").localeCompare(c||"9999"));
    const t = todayISO().slice(0,7); const firstOpen = keys.includes(t) ? t : (keys.find(k=>k>=t) || keys[0]);
    groupedHtml = `<div class="stack-s">${keys.map(k=>{ const g=list.filter(p=>(p.month||"")===k); const d=g.filter(p=>p.status==="Completed").length; const fk="paintings:m:"+(k||"none");
      return `<details class="panel mgrp" data-fold="${fk}"${foldOpen(fk, k===firstOpen)?" open":""}><summary class="hd"><h2>${esc(k?monthLabel(k):"Unscheduled drafts")}</h2><span class="small muted num">${d}/${g.length} done</span>${ICON.down}</summary><div class="bd"><div class="list">${g.map(p=>paintingRow(p)).join("")}</div></div></details>`; }).join("")}</div>`;

function suggestWorkshops(p){

function teacherIndex(){
  if(teacherIndex.cache) return teacherIndex.cache;
  const T = new Map(); const get = n => { const k = norm(n).trim(); if(!k) return null; if(!T.has(k)) T.set(k, {name:n.trim(), ws:[], paintings:[], arts:new Set(), plats:new Set(), sheet:null, variants:new Set()}); return T.get(k); };
  for(const w of IX.wsList){ const n = wsEff(w).teacher; if(!n) continue; const t = get(n); t.ws.push(w); if(w["Art Form / Tradition"]) t.arts.add(w["Art Form / Tradition"]); if(w["Provider group"]) t.plats.add(w["Provider group"]); if(w["Teacher / Instructor"] && w["Teacher / Instructor"]!==t.name) t.variants.add(w["Teacher / Instructor"]); }
  for(const p of S.paintings.values()) for(const n of String(p.teacher||"").split(/;/)){ const t = get(n); if(t){ t.paintings.push(p); if(p.tradition) t.arts.add(p.tradition); } }
  const TS = S.ref.workshops && S.ref.workshops.teachers; if(TS){ const F = TS.fields; for(const r of TS.rows){ const o={}; F.forEach((f,i)=>o[f]=r[i]); const t = T.get(norm(o["Teacher / Instructor"]).trim()); if(t) t.sheet = o; } }
  teacherIndex.cache = T; teacherIndex.ver = S.paintings.size+":"+S.meta.size; return T;
}

/* ============================================================ THEME REFERENCE */
function themeSubject(t){ let n = t.name.replace(/^\d+\.\s*/,""); if(n.includes(" - ")) n = n.split(" - ")[0]; return n.trim(); }
const CAT_CTX = {"Krishna Leela":"Krishna Leela","Ramayana":"Ramayana","Mahabharata":"Mahabharata","Baromasa (Months & Moods)":"Baromasa","Rites of Passage":"samskara","Folk Deities":"folk deity","Hindu Kings":"king","64 Yoginis":"Yogini","108 Karanas (Shiva)":"Karana Shiva dance","Forms of Vishnu":"Vishnu","Hindu Queens":"queen","Forms of Durga":"Durga","Durga Saptashati Scenes":"Durga Saptashati","Ragamala":"Ragamala","Nayika Bheda":"Nayika","Navarasa":"rasa","Bhakti Saint-Poets":"Bhakti saint","Shakti Peethas":"Shakti Peetha","Forms of Kali":"Kali","Sri Chakra & Lalita":"Lalita Sri Chakra","Krishna's Ashtabharya":"Krishna queen","Shiva's Family":"Shiva","Hitopadesha (Fables)":"Hitopadesha","Vahana Reference":"vahana","Nakshatras":"nakshatra"};
function themeContext(t){
  let c = CAT_CTX[t.cat.name] || "";
  if(["Puranas","Ramayana Retellings","Regional Oral Epics"].includes(t.cat.name) && t.group) c = t.group.split(" (")[0].split(" - ")[0];
  if(t.cat.name==="Forms of Kali" && t.group && t.group.startsWith("Dasa")) c = "Mahavidya";
  if(t.cat.name==="Vahana Reference" && t.detail) c = Object.values(t.detail)[0] + " vahana";
  const subj = norm(themeSubject(t));
  return c.split(" ").filter(w=>w && !subj.includes(norm(w))).join(" ");
}
function themeQueries(t, art){
  const base = [themeSubject(t), themeContext(t)].filter(Boolean).join(" ");
  const a = (art||"").trim();
  return { img: `${base} ${a || "Indian"} painting traditional art reference`.replace(/\s+/g," ").trim(),
           yt: `${base} ${a ? a.replace(/\//g," ") : "Indian folk"} painting tutorial`.replace(/\s+/g," ").trim() };
}
function themeRow(t){
  const m = getMeta("theme", t.id); const q = themeQueries(t, S.ui.themeArt); const open = S.ui.openNotes.has(t.id);
  const subs = m.subthemes||[];
  return `<div class="trow"><div class="row" style="align-items:flex-start"><div class="grow" style="min-width:0"><div class="t" style="font-weight:600">${esc(t.name)}</div>
    ${t.detail?`<div class="small ink2">${Object.entries(t.detail).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(" · ")}</div>`:""}
    ${S.ui.themeQ||S.ui.themeFavs?`<div class="tiny muted">${esc(t.cat.name)}${t.group?" › "+esc(t.group):""}</div>`:""}
    ${m.notes&&!open?`<div class="small ink2" style="margin-top:4px">${esc(m.notes)}</div>`:""}</div>
    <button class="icon-btn" data-theme-fav="${attr(t.id)}" aria-pressed="${!!m.fav}" aria-label="Save theme">${m.fav?ICON.starF:ICON.star}</button></div>
    <div class="acts"><a class="btn sm" href="${attr(imgQ(q.img))}" target="_blank" rel="noopener" title="${attr(q.img)}">${ICON.img} Reference Images</a><a class="btn sm" href="${attr(ytQ(q.yt))}" target="_blank" rel="noopener" title="${attr(q.yt)}">${ICON.yt} YouTube Tutorials</a>
      <button class="btn sm" data-theme-add="${attr(t.id)}">${ICON.plus} Add</button><button class="btn sm" data-theme-notes="${attr(t.id)}">${ICON.note} Notes</button></div>
    ${open?`<div class="stack-s" style="margin-top:8px"><textarea class="in" data-theme-note="${attr(t.id)}" placeholder="Iconography, colours, references…">${esc(m.notes||"")}</textarea>
      <div class="small muted">Sub-themes you add (for example, individual beshas) sit under this theme.</div>
      ${subs.map((s,i)=>`<div class="row"><span class="grow">• ${esc(s)}</span><a class="btn sm ghost" href="${attr(imgQ(s+" "+themeSubject(t)+" "+(S.ui.themeArt||"Indian")+" painting traditional art reference"))}" target="_blank" rel="noopener">${ICON.img}</a><a class="btn sm ghost" href="${attr(ytQ(s+" "+themeSubject(t)+" "+(S.ui.themeArt||"Indian folk")+" painting tutorial"))}" target="_blank" rel="noopener">${ICON.yt}</a><button class="icon-btn" data-sub-del="${attr(t.id)}" data-i="${i}" aria-label="Remove">${ICON.x}</button></div>`).join("")}
      <div class="row"><input class="in grow" id="sub-${attr(t.id)}" placeholder="Add a sub-theme"><button class="btn sm" data-sub-add="${attr(t.id)}">Add</button></div></div>`
      : subs.length?`<div class="small ink2" style="margin-top:6px">${subs.length} sub-theme${subs.length>1?"s":""}: ${subs.map(esc).join(", ")}</div>`:""}
  </div>`;

const EL_CTX = {"Figures":"human figure", "Divine":"deity figure", "Decorative":"", "Objects & Structures":"", "Nature":"", "Domestic Animals":"", "Wild & Other Animals":""};

function elementRow(g, it, art){

function elementsView(ctl, crumbs){
  const E = S.ref.themes.elements; if(!E) return `<div class="empty">Visual elements aren't in this data file.</div>`;
  const art = (S.ui.themeArt||"").trim();

    return `<section class="panel"><div class="hd"><h2>${esc(g.name)}</h2><span class="small muted num">${art?`${n} of ${g.items.length} practised`:`${g.items.length} elements`}</span></div><div class="bd">${g.items.map(it=>elementRow(g,it,art)).join("")}</div></section>`; }).join("");
  const by = new Map(); for(const m of S.meta.values()){ if(m.kind==="element" && m.done){ const a = String(m.ref).split("|")[0]; by.set(a, (by.get(a)||0)+1); } }
  const prog = [...by.entries()].sort((a,b)=>b[1]-a[1]);
  const head = art

       ${prog.length?`<section class="panel"><div class="hd"><h2>Progress by style</h2></div><div class="bd list">${prog.map(([a,n])=>`<div class="item click" data-el-art="${attr(a)}"><div class="grow">${esc(a)}</div><span class="small muted num">${n} of ${total}</span></div>`).join("")}</div></section>`:""}`;
  return `<div class="stack"><div class="crumbs">${crumbs}</div><div><h2>Visual elements</h2><div class="small muted">${E.groups.length} groups · ${total} elements · from the “Art Forms x Visual Elements” tab of the Checklist workbook</div></div>${ctl}${head}${panels}</div>`;
}
VIEWS.themes = function(){
  const T = S.ref.themes; if(!T) return `<div class="empty">Theme Reference is loading…</div>`;
  const total = IX.themeList.length; const trads = traditionsList();
  const ctl = `<div class="fgrid"><label class="f"><span>Search all ${total.toLocaleString()} themes</span><input class="in" type="search" data-ui="themeQ" value="${attr(S.ui.themeQ)}" placeholder="e.g. Kaliya, Navadurga, Megh"></label>

/* ============================================================ WORKSHOPS */
VIEWS.workshops = function(){
  const W = S.ref.workshops; if(!W) return `<div class="empty">Workshop archive is loading…</div>`;
  const sub = S.ui.wsub;
  const nLeft = IX.wsList.filter(wsNeedsReview).length;
  const subs = [["records","Records"],["review",`Review queue (${nLeft.toLocaleString()})`],["teachers","Teachers"],["platforms","Platforms"],["artforms","Art forms"],["map","Art form–teacher map"],["recon","Name reconciliation"],["about","About this archive"]];
  let body = "";
  if(sub==="records") body = wsRecords();
  else if(sub==="review") body = reviewQueueView();
  else if(sub==="about") body = `<div class="grid2"><section class="panel"><div class="hd"><h2>Read me</h2></div><div class="bd"><dl class="kv">${W.readme.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div></section>
      <section class="panel"><div class="hd"><h2>Dashboard (as supplied)</h2></div><div class="bd"><dl class="kv">${W.dashboard.slice(1).map(([a,b])=>`<dt>${esc(a)}</dt><dd class="num">${esc(b)}</dd>`).join("")}</dl></div></section>
      <section class="panel"><div class="hd"><h2>Styles with no workshop logged</h2><span class="small muted">${W.noWorkshopLogged.length}</span></div><div class="bd small">${W.noWorkshopLogged.map(esc).join(" · ")}</div></section></div>`;
  else if(sub==="platforms") body = platformsView();
  else { const key = {teachers:"teachers",platforms:"platforms",artforms:"artforms",map:"artformTeacherMap",recon:"nameReconciliation"}[sub]; const t = W[key]; const q = norm(S.ui.wq);
    const rows = t.rows.filter(r=>!q || norm(r.join(" ")).includes(q));
    body = `<label class="f"><span>Filter</span><input class="in" type="search" data-ui="wq" value="${attr(S.ui.wq)}"></label><div class="small muted num">${rows.length} of ${t.rows.length} rows</div>
      <div class="tablewrap"><table><thead><tr>${t.fields.map(f=>`<th>${esc(f)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&(sub==="teachers"||sub==="artforms"||sub==="platforms")?` class="click"`:""}>${i===0&&(sub==="teachers"||sub==="artforms"||sub==="platforms")?`<a href="#" ${sub==="teachers"?`data-teacher="${attr(c)}"`:`data-wfilter="${sub==="artforms"?"art":"prov"}" data-v="${attr(c)}"`}>${esc(c)}</a>`:esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
  return `<div class="stack"><div><h2>Workshop archive</h2><div class="small muted">${IX.wsList.length.toLocaleString()} historical learning records from Attended_Workshops_Master_Merged.xlsx. Workshops are not paintings.</div></div>
    <div class="chips">${subs.map(([k,l])=>`<button class="chip" data-wsub="${k}" aria-pressed="${sub===k}">${l}</button>`).join("")}</div>${body}</div>`;
};
function wsRecords(){
  const f = S.ui.wf; const q = norm(S.ui.wq.trim());
  const uniq = k => [...new Set(IX.wsList.map(w=>w[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const list = IX.wsList.filter(w => (!f.art || w["Art Form / Tradition"]===f.art) && (!f.teacher || w["Teacher (reconciled)"]===f.teacher || w["Teacher / Instructor"]===f.teacher) && (!f.prov || w["Provider group"]===f.prov || w["Platform / Provider"]===f.prov) && (!f.type || w["Record Type"]===f.type) && (!f.review || (f.review==="Yes" ? wsNeedsReview(w) : f.review==="mine" ? !!(wsReview(w)&&wsReview(w).status!=="skipped") : !wsNeedsReview(w))) && (!q || w._q.includes(q) || norm(getMeta("workshop",w.id).notes).includes(q) || (wsEff(w).edited && norm(Object.values(wsEff(w)).join(" ")).includes(q))));
  const shown = list.slice(0, S.ui.wlimit);
  const nOn = Object.values(f).filter(Boolean).length;
  return `<input class="in" type="search" data-ui="wq" value="${attr(S.ui.wq)}" placeholder="Search titles, teachers, art forms, platforms, notes" aria-label="Search workshops">
    <details class="filters" data-fold="workshops:filters"${foldOpen("workshops:filters",false)?" open":""}><summary class="btn sm">${ICON.filter} Filters${nOn?` (${nOn} on)`:""}</summary><div class="fgrid" style="margin-top:8px">
    <label class="f"><span>Art form</span>${sel('data-wf="art"', [["","All art forms"],...uniq("Art Form / Tradition")], f.art)}</label>
    <label class="f"><span>Teacher (reconciled)</span>${sel('data-wf="teacher"', [["","All teachers"],...[...new Set(IX.wsList.map(w=>w["Teacher (reconciled)"]||w["Teacher / Instructor"]).filter(Boolean))].sort()], f.teacher)}</label>
    <label class="f"><span>Platform / provider group</span>${sel('data-wf="prov"', [["","All platforms"],...uniq("Provider group")], f.prov)}</label>
    <label class="f"><span>Record type</span>${sel('data-wf="type"', [["","All types"],...uniq("Record Type")], f.type)}</label>
    <label class="f"><span>Needs review</span>${sel('data-wf="review"', [["","Any"],["Yes","Still needs review"],["No","Not flagged or reviewed"],["mine","Reviewed by you"]], f.review)}</label>
    <div class="f" style="justify-content:flex-end"><button class="btn sm ghost" data-act="wf-clear">Clear filters</button></div></div></details>
    <div class="small muted"><span class="num">${list.length.toLocaleString()}</span> records match. The source has no workshop dates; "Status / Season" values such as "Paid" are searchable.</div>
    <section class="panel"><div class="bd">${shown.length?`<div class="list">${shown.map(w=>wsLine(w, (getMeta("workshop",w.id).notes?`<span class="pill outline">Note</span>`:"") + (linkedPaintings(w.id).length?`<span class="pill active">${linkedPaintings(w.id).length} painting</span>`:""))).join("")}</div>`:`<div class="small muted">No records match.</div>`}
    ${list.length>shown.length?`<div style="padding-top:10px"><button class="btn" data-act="ws-more">Show ${Math.min(80,list.length-shown.length)} more</button></div>`:""}</div></section>`;
}
function linkedPaintings(wid){ return [...S.paintings.values()].filter(p=>p.workshopIds.includes(wid)); }

/* ============================================================ LIBRARY */
VIEWS.library = function(){
  const sub = S.ui.lib;
  const head = `<div><h2>Library</h2><div class="small muted">Art forms, your pigments and surfaces, teachers, learning resources and Shilpa references.</div></div>
    <div class="chips">${[["artforms","Art Forms"],["pigments","Pigments"],["surfaces","Surfaces"],["teachers","Teachers"],["resources","Resources"],["shilpa","Shilpa"]].map(([k,l])=>`<button class="chip" data-lib="${k}" aria-pressed="${sub===k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if(sub==="pigments" || sub==="surfaces"){ body = recordsView(sub); }
  else if(sub==="teachers"){ body = teachersView(); }
  else if(sub==="artforms"){
    const A = S.ref.artforms; if(!A) return head+`<div class="empty">Loading…</div>`;
    const q = norm(S.ui.libQ); const list = A.artforms.filter(a=>!q || norm(a.name).includes(q) || norm(getMeta("artform",a.id).stdCat).includes(q));
    body = `<label class="f"><span>Search ${A.artforms.length} art forms</span><input class="in" type="search" data-ui="libQ" value="${attr(S.ui.libQ)}" placeholder="e.g. Cheriyal, Sohrai"></label>
      <div class="small muted">Names come from the Checklist (Iconography Reference) and the workshop archive's Art Forms sheet. Only identical names are combined; spelling variants stay separate.</div>
      <section class="panel"><div class="bd"><div class="list">${list.map(a=>{ const m=getMeta("artform",a.id); const wc = a.workshop?.records; return `<div class="item click" data-af="${attr(a.id)}"><div class="grow" style="min-width:0"><div class="row"><span class="t grow">${esc(a.name)}</span>${m.stdCat?`<span class="pill outline">${esc(m.stdCat)}</span>`:""}${a.noWorkshopLogged?`<span class="pill deferred">No workshop logged</span>`:""}</div>
        <div class="small muted">${esc(a.sources.map(s=>s.split(" — ")[0]).filter((v,i,arr)=>arr.indexOf(v)===i).join(" + "))}${wc?` · ${esc(wc)} workshop records`:""}${a.workshop?.teachers?` · ${esc(a.workshop.teachers)}`:""}</div></div></div>`; }).join("")}</div></div></section>`;
  } else {
    const shilpa = sub==="shilpa";
    const mine = [...S.resources.values()].filter(r => shilpa ? r.section==="Shilpa" : r.section!=="Shilpa").sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    const imported = (S.ref.resources?.resources||[]).filter(r => shilpa ? r.section==="Shilpashastra" : r.section!=="Shilpashastra");
    const q = norm(S.ui.libQ);
    const mf = mine.filter(r=>!q || norm([r.title,r.type,r.notes,r.artForms,r.themes,r.url].join(" ")).includes(q));
    const imf = imported.filter(r=>!q || norm(r.title+" "+r.section+" "+r.url).includes(q));
    const bySec = new Map(); for(const r of imf){ if(!bySec.has(r.section)) bySec.set(r.section, []); bySec.get(r.section).push(r); }
    body = `<div class="row between"><label class="f grow"><span>Search ${shilpa?"Shilpa references":"resources"}</span><input class="in" type="search" data-ui="libQ" value="${attr(S.ui.libQ)}"></label><button class="btn primary" data-act="new-res" data-sec="${shilpa?"Shilpa":"Library"}" style="align-self:flex-end">${ICON.plus} Add ${shilpa?"Shilpa reference":"resource"}</button></div>
      ${shilpa?`<div class="small muted">The source files hold one Shilpa record: the Shilpashastra page of Art Master Copy lists Kashyap Shilpashastra. Add texts, chapters and measurements you study here.</div>`:""}
      <section class="panel"><div class="hd"><h2>My ${shilpa?"Shilpa references":"resources"}</h2><span class="small muted num">${mf.length}</span></div><div class="bd">${mf.length?`<div class="list">${mf.map(resRow).join("")}</div>`:`<div class="small muted">Books, PDFs, articles, museum references, artist websites, videos and notes you add appear here, linked to art forms, themes, workshops and paintings.</div>`}</div></section>
      <section class="panel"><div class="hd"><h2>Imported from Art Master Copy</h2><span class="small muted num">${imf.length} links</span></div><div class="bd">
        ${[...bySec.entries()].map(([s,arr])=>{ const open = S.ui.resOpen.has(s) || (q && arr.length<40) || arr.length<=3; return `<details ${open?"open":""} data-res-sec="${attr(s)}"><summary>${esc(s)} <span class="muted small num">${arr.length}</span></summary>${open?`<div class="list">${arr.map(r=>`<div class="item"><div class="grow" style="min-width:0"><a href="${attr(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="tiny muted clip">${esc(r.url)} · page ${esc(r.src.page)}</div></div></div>`).join("")}</div>`:""}</details>`; }).join("") || `<div class="small muted">No imported links match.</div>`}
      </div></section>`;
  }
  return `<div class="stack">${head}${body}</div>`;
};
function resRow(r){ return `<div class="item click" data-act="edit-res" data-id="${attr(r.id)}"><div class="grow" style="min-width:0"><div class="row"><span class="t grow">${esc(r.title)}</span>${r.type?`<span class="pill outline">${esc(r.type)}</span>`:""}</div>
  ${r.url?`<div class="tiny muted clip">${esc(r.url)}</div>`:""}<div class="small muted">${esc([r.artForms,r.themes,r.workshops,(r.paintingIds||[]).join(", ")].filter(Boolean).join(" · "))}</div>${r.notes?`<div class="small ink2">${esc(r.notes)}</div>`:""}</div></div>`; }

/* ============================================================ PORTFOLIO */
function bookChapters(){ const s = new Set((S.settings.bookChapters||[]).filter(Boolean)); for(const p of S.paintings.values()) if(p.book && p.bookChapter) s.add(p.bookChapter.trim()); return [...s].sort((a,c)=>a.localeCompare(c)); }
function bookChecks(p){ return {done:p.status==="Completed", photo:p.photos.some(x=>x.type==="final"), research:!!(p.researchNotes||p.culturalContext||p.culturalRefs||p.portfolioNotes), process:!!p.portfolioProcess}; }
function bookReady(p){ const c = bookChecks(p); return c.done && c.photo && c.research && c.process; }
function bookView(){
  const chapters = bookChapters(); const tagged = paintingsArr().filter(p=>p.book);
  const rows = chapters.map(ch => { const ps = tagged.filter(p=>norm(p.bookChapter).trim()===norm(ch)); return {ch, ps, ready: ps.some(bookReady)}; });
  const loose = tagged.filter(p=>!p.bookChapter || !chapters.some(c=>norm(c)===norm(p.bookChapter).trim()));
  const nReady = rows.filter(r=>r.ready).length;
  const tick = (ok,label) => `<span class="chk-item ${ok?"ok":""}">${ok?"✓":"○"} ${label}</span>`;
  const pline = p => { const c = bookChecks(p); return `<div class="item"><div class="grow" style="min-width:0"><button class="bt" data-act="open-ws" data-id="${attr(p.id)}" data-sec="reflection">${esc(p.id)} · ${esc(p.title)}</button><div class="row small" style="gap:10px;margin-top:2px">${tick(c.done,"completed")}${tick(c.photo,"final photo")}${tick(c.research,"research notes")}${tick(c.process,"process note")}</div></div></div>`; };
  const addSel = ch => { const opts = paintingsArr().filter(p=>!(p.book && norm(p.bookChapter)===norm(ch))); return sel(`data-book-add="${attr(ch)}" aria-label="Add a painting to ${attr(ch)}" style="max-width:360px"`, [["","+ Add a painting to this chapter"],...opts.map(p=>[p.id, `${p.id} · ${p.title}`])], ""); };
  return `<div class="stats"><div class="card stat"><div class="cap">Chapters</div><div class="v num">${chapters.length}</div></div><div class="card stat"><div class="cap">Ready</div><div class="v num">${nReady}</div></div><div class="card stat"><div class="cap">Paintings tagged</div><div class="v num">${tagged.length}</div></div><div class="card stat"><div class="cap">Still to paint</div><div class="v num">${rows.filter(r=>!r.ps.length).length}</div></div></div>
    <details class="filters" data-fold="book:chapters"${foldOpen("book:chapters", !chapters.length)?" open":""}><summary class="btn sm">${ICON.edit} Edit chapter list</summary><div class="stack-s" style="margin-top:8px"><textarea class="in" data-set="bookChapters" rows="8" placeholder="One chapter per line, e.g. Pattachitra">${esc((S.settings.bookChapters||[]).join("\n"))}</textarea><div class="small muted">Type your book's traditions, one per line. Chapters also appear when you tag a painting with a new chapter name.</div></div></details>
    ${rows.length? rows.map(r=>`<section class="panel" data-nofold><div class="hd"><h2>${esc(r.ch)}</h2><span class="pill ${r.ready?"done":r.ps.length?"active":""}">${r.ready?"Ready":r.ps.length?"In progress":"No painting yet"}</span></div><div class="bd">${r.ps.length?`<div class="list">${r.ps.map(pline).join("")}</div>`:""}<div style="margin-top:6px">${addSel(r.ch)}</div></div></section>`).join("") : `<div class="empty">No chapters yet. Add your chapter list above, or tag a painting in its Reflection section.</div>`}
    ${loose.length?`<section class="panel" data-nofold><div class="hd"><h2>Tagged without a chapter</h2><span class="small muted num">${loose.length}</span></div><div class="bd"><div class="list">${loose.map(pline).join("")}</div></div></section>`:""}`;
}
VIEWS.book = function(){ return `<div class="stack"><div><h2>Book</h2><div class="small muted">Your chapters, their research journals, and which have a finished painting with photos and notes.</div></div>${bookViewJ()}</div>`; };
VIEWS.portfolio = function(){
  const ps = paintingsArr().filter(p=>p.portfolio).sort((a,b)=>(b.completedDate||"").localeCompare(a.completedDate||""));
  const finalOf = p => p.photos.find(x=>x.type==="final");
  return `<div class="stack"><div class="row between"><div><h2>Portfolio</h2><div class="small muted">Paintings you choose to show. Turn on "Show this painting in the Portfolio" in a painting's Reflection section.</div></div>${ps.length?`<button class="btn primary" data-act="portfolio-export">Download portfolio</button>`:""}</div>
  ${ps.length?`<div class="gallery">${ps.map(p=>{const f=finalOf(p); return `<button class="gcard" data-act="portfolio-open" data-id="${attr(p.id)}"><div class="im">${f?`<img src="/_blob/${attr(f.asset)}" alt="${attr(p.title)}" loading="lazy">`:"No final photo yet"}</div><div class="tx"><div style="font-weight:600">${esc(p.title)}</div><div class="small muted">${esc(p.tradition)}${p.completedDate?" · "+fmtDate(p.completedDate):""}</div></div></button>`;}).join("")}</div>`
    : `<div class="empty">No paintings in the portfolio yet. ${[...S.paintings.values()].filter(p=>p.status==="Completed").length} completed paintings are ready to add.</div>`}</div>`;
};

/* ============================================================ REVIEW */
VIEWS.review = function(){
  const f = S.ui.rv; const all = paintingsArr();
  const years = [...new Set(periodMonths().map(m=>m.slice(0,4)).concat(all.map(p=>p.month.slice(0,4)).filter(Boolean)))].sort();
  const trads = [...new Set(all.map(p=>p.tradition).filter(Boolean))].sort();
  const ps = all.filter(p => (!f.trad || p.tradition===f.trad) && (!f.year || p.month.startsWith(f.year)) && (!f.month || p.month===f.month));
  const months = periodMonths().filter(m=>(!f.year||m.startsWith(f.year)) && (!f.month||m===f.month));
  const maxPl = Math.max(1, ...months.map(m=>ps.filter(p=>p.month===m && p.status!=="Deferred").length));
  const cols = months.map(m=>{ const pl=ps.filter(p=>p.month===m && p.status!=="Deferred"); const d=pl.filter(p=>p.status==="Completed").length; return `<div class="c" title="${attr(monthLabel(m))}: ${d} completed of ${pl.length} planned"><span class="tiny num">${d}/${pl.length}</span><div class="pl" style="height:${pl.length*100/maxPl}%"><i style="height:${pl.length?d*100/pl.length:0}%"></i></div></div>`; }).join("");
  const wkMonth = f.month || (periodMonths().includes(todayISO().slice(0,7)) ? todayISO().slice(0,7) : periodMonths()[0]);
  const wk = WEEKS.map(w=>{ const pl=ps.filter(p=>p.month===wkMonth && p.week===w && p.status!=="Deferred"); const d=pl.filter(p=>p.status==="Completed").length; return pl.length?`<div class="hbar"><span class="lb">${esc(w)}</span><div class="bar"><i style="width:${d*100/pl.length}%"></i></div><span class="vl num">${d}/${pl.length}</span></div>`:""; }).join("");
  const hours = ps.reduce((a,p)=>a+pHours(p),0);
  const byArt = new Map(); for(const p of ps){ const h=pHours(p); if(h>0) byArt.set(p.tradition||p.artForm, (byArt.get(p.tradition||p.artForm)||0)+h); }
  const artRows = [...byArt.entries()].sort((a,b)=>b[1]-a[1]); const maxH = Math.max(1,...artRows.map(r=>r[1]));
  const stc = STATUSES.map(s=>[s, ps.filter(p=>p.status===s).length]).filter(x=>x[1]); const maxS=Math.max(1,...stc.map(x=>x[1]));
  const resched = ps.flatMap(p=>p.history.map(h=>({p,h}))).sort((a,b)=>(b.h.date||"").localeCompare(a.h.date||""));
  const deferred = ps.filter(p=>p.status==="Deferred");
  const done = ps.filter(p=>p.status==="Completed").sort((a,b)=>(a.completedDate||"").localeCompare(b.completedDate||""));
  const act = allActivity().filter(a=>!f.trad || !a.ref || (S.paintings.get(a.ref)?.tradition===f.trad)).slice(0,60);
  return `<div class="stack"><div><h2>Review</h2><div class="small muted">Calculated from your painting records.</div></div>
  <div class="fgrid"><label class="f"><span>Year</span>${sel('data-rv="year"', [["","All years"],...years], f.year)}</label><label class="f"><span>Month</span>${sel('data-rv="month"', [["","All months"],...periodMonths().map(m=>[m,monthLabel(m)])], f.month)}</label><label class="f full"><span>Art tradition</span>${sel('data-rv="trad"', [["","All traditions"],...trads], f.trad)}</label></div>
  <div class="stats"><div class="card stat"><div class="cap">Planned</div><div class="v num">${ps.filter(p=>p.status!=="Deferred"&&p.month).length}</div></div><div class="card stat"><div class="cap">Completed</div><div class="v num">${done.length}</div></div><div class="card stat"><div class="cap">Studio hours</div><div class="v num">${fmtHours(hours)}</div></div><div class="card stat"><div class="cap">Deferred</div><div class="v num">${deferred.length}</div></div></div>
  <section class="panel"><div class="hd"><h2>Planned vs completed by month</h2><span class="legend"><span><i style="background:var(--rust)"></i>Completed</span><span><i style="background:var(--track)"></i>Planned</span></span></div><div class="bd"><div class="cols">${cols}</div><div class="collb">${months.map(m=>`<span>${esc(monthShort(m))}</span>`).join("")}</div></div></section>
  <div class="grid2">
  <section class="panel"><div class="hd"><h2>Weekly progress</h2><span class="small muted">${esc(monthLabel(wkMonth))}</span></div><div class="bd">${wk||`<div class="small muted">No paintings planned.</div>`}</div></section>
  <section class="panel"><div class="hd"><h2>Status</h2></div><div class="bd">${stc.map(([s,n])=>`<div class="hbar"><span class="lb">${esc(s)}</span><div class="bar"><i style="width:${n*100/maxS}%"></i></div><span class="vl num">${n}</span></div>`).join("")||`<div class="small muted">No records.</div>`}</div></section>
  <section class="panel"><div class="hd"><h2>Hours by art form</h2><span class="small muted num">${fmtHours(hours)} h</span></div><div class="bd">${artRows.length?artRows.map(([a,h])=>`<div class="hbar"><span class="lb">${esc(a)}</span><div class="bar"><i style="width:${h*100/maxH}%"></i></div><span class="vl num">${fmtHours(h)} h</span></div>`).join(""):`<div class="small muted">Hours appear once you log studio sessions.</div>`}</div></section>
  <section class="panel"><div class="hd"><h2>Rescheduling</h2><span class="small muted num">${resched.length}</span></div><div class="bd">${resched.length?`<div class="list">${resched.slice(0,30).map(({p,h})=>`<div class="item click" data-act="open-ws" data-id="${attr(p.id)}"><div class="grow small"><div class="t">${esc(p.id)} ${esc(p.title)}</div>${esc(monthLabel(h.from.month))} ${esc(h.from.week||"")} → ${esc(monthLabel(h.to.month))} ${esc(h.to.week||"")} · ${fmtDate(h.date)}${h.reason?" · "+esc(h.reason):""}</div></div>`).join("")}</div>`:`<div class="small muted">No paintings moved yet.</div>`}</div></section>
  </div>
  <section class="panel"><div class="hd"><h2>Deferred projects</h2><button class="btn sm ghost" data-goto="deferred">Open</button></div><div class="bd">${deferred.length?`<div class="list">${deferred.map(p=>`<div class="item click" data-act="open-ws" data-id="${attr(p.id)}"><div class="grow small"><div class="t">${esc(p.id)} ${esc(p.title)}</div>${p.deferral?esc(p.deferral.reason||"No reason recorded"):""}</div></div>`).join("")}</div>`:`<div class="small muted">None.</div>`}</div></section>

/* ============================================================ SEARCH */
VIEWS.search = function(){
  const q = norm(S.ui.searchQ.trim());
  let res = "";
  if(q.length>=2){
    const ps = paintingsArr().filter(p=>norm([p.id,p.title,p.artForm,p.tradition,p.theme,p.subject,p.teacher,p.platform,p.notes,p.researchNotes,p.processNotes,p.reflections,p.culturalContext].join(" ")).includes(q)).slice(0,30);
    const th = IX.themeList.filter(t=>norm(t.name).includes(q) || norm(t.cat.name).includes(q) || norm(getMeta("theme",t.id).notes).includes(q)).slice(0,30);
    const ws = IX.wsList.filter(w=>w._q.includes(q) || norm(getMeta("workshop",w.id).notes).includes(q)).slice(0,30);
    const ideas = [...S.ideas.values()].filter(i=>norm([i.title,i.theme,i.artForm,i.notes,i.category].join(" ")).includes(q)).slice(0,20);
    const tasks = [...S.tasks.values()].filter(t=>norm(t.title+" "+t.notes).includes(q)).slice(0,20);
    const afs = (S.ref.artforms?.artforms||[]).filter(a=>norm(a.name).includes(q)).slice(0,20);
    const sec = (title, n, html) => n?`<section class="panel"><div class="hd"><h2>${title}</h2><span class="small muted num">${n}${n>=30?"+":""}</span></div><div class="bd"><div class="list">${html}</div></div></section>`:"";
    res = sec("Paintings", ps.length, ps.map(p=>`<div class="item click" data-act="open-ws" data-id="${attr(p.id)}"><div class="grow"><div class="t">${esc(p.title)}</div><div class="small muted">${esc(p.id)} · ${esc(p.artForm)} · ${esc(monthLabel(p.month))}</div></div>${statusPill(p.status)}</div>`).join(""))
      + sec("Themes", th.length, th.map(t=>`<div class="item click" data-theme-jump="${attr(t.id)}"><div class="grow"><div class="t">${esc(t.name)}</div><div class="small muted">${esc(t.cat.name)}${t.group?" › "+esc(t.group):""}</div></div></div>`).join(""))
      + sec("Workshops", ws.length, ws.map(w=>wsLine(w)).join(""))
      + sec("Art forms", afs.length, afs.map(a=>`<div class="item click" data-af="${attr(a.id)}"><div class="grow t">${esc(a.name)}</div></div>`).join(""))
      + sec("Ideas", ideas.length, ideas.map(i=>`<div class="item click" data-act="edit-idea" data-id="${attr(i.id)}"><div class="grow t">${esc(i.title)}</div></div>`).join(""))
      + sec("Tasks", tasks.length, tasks.map(taskRow).join(""))
      + (()=>{ const T=S.ref.journal; if(!T) return ""; const hits=[]; for(const d of S.journals.values()){ for(const s of T.sections) for(const qq of s.questions){ const a=String((d.answers||{})[qq.field]||""); const i=norm(a).indexOf(q); if(i>=0) hits.push({d,s,a,i}); } } const top=hits.slice(0,20);
          return sec("Chapter journals", top.length, top.map(h=>`<div class="item click" data-jopen="${attr(h.d.title)}"><div class="grow"><div class="t">${esc(h.d.title)} · ${h.s.n}. ${esc(h.s.title)}</div><div class="small muted">…${esc(h.a.slice(Math.max(0,h.i-40), h.i+80))}…</div></div></div>`).join("")); })()
      + (()=>{ const cs=[...S.outreach.values()].filter(c=>norm([c.name,c.org,c.role,c.notes].join(" ")).includes(q)).slice(0,20); return sec("Outreach contacts", cs.length, cs.map(c=>`<div class="item click" data-or-open="contact" data-id="${attr(c.id)}"><div class="grow"><div class="t">${esc(c.name)}</div><div class="small muted">${esc([c.org,c.status].filter(Boolean).join(" · "))}</div></div></div>`).join("")); })()
      + (()=>{ const vs=[...S.venues.values()].filter(x=>norm([x.name,x.location,x.notes,(x.items||[]).map(i=>i.title).join(" ")].join(" ")).includes(q)).slice(0,20); return sec("Exhibitions & displays", vs.length, vs.map(x=>`<div class="item click" data-or-open="venue" data-id="${attr(x.id)}"><div class="grow"><div class="t">${esc(x.name)}</div><div class="small muted">${esc([x.type,x.status].filter(Boolean).join(" · "))}</div></div></div>`).join("")); })();
    if(!res) res = `<div class="empty">Nothing matches "${esc(S.ui.searchQ)}".</div>`;
  }
  return `<div class="stack"><h2>Search everything</h2><label class="f"><span>Paintings, themes, teachers, workshops, art forms, ideas, notes</span><input class="in" type="search" data-ui="searchQ" id="gsearch" value="${attr(S.ui.searchQ)}" placeholder="Type at least two letters" autofocus></label>${res}</div>`;
};

const SH = {actions:{}, confirm:null};
function openSheet(title, body, actions={}, opts={}){
  SH.actions = actions; SH.confirm = null;
  $("#overlay").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="icon-btn" data-sh="close" aria-label="Close">${ICON.x}</button></div>${body}</div></div>`;
  const first = $("#overlay .sheet [autofocus]"); if(first) setTimeout(()=>first.focus(), 30);
}
function closeOverlay(fromAction){
  if(!$("#overlay").firstChild) return;
  $("#overlay").innerHTML = ""; SH.actions = {};
  if(renderPending) render();
}
const v = id => { const el = document.getElementById(id); return el ? (el.type==="checkbox" ? el.checked : el.value.trim()) : ""; };
function paintingOptions(blankLabel="— None —"){ return [["",blankLabel], ...paintingsArr().map(p=>[p.id, `${p.id} · ${p.title}`])]; }
function confirmBtn(label, key="del"){ return `<button class="btn danger" data-sh="${key}">${esc(label)}</button>`; }
function twoStep(btn, label){ if(SH.confirm===btn.dataset.sh) return true; SH.confirm = btn.dataset.sh; btn.textContent = label || "Tap again to confirm"; return false; }

function createPainting(o){
  const id = nextPaintingId(); const maxSeq = Math.max(0,...[...S.paintings.values()].map(p=>+p.seq||0));
  const p = normPainting({...o, id, seq:maxSeq+1, draft:!o.month, createdAt:nowISO(), status:"Not Started", stages:null});
  savePainting(p, 0); logAct("create", `Added ${id} ${p.title}${p.month?"":" as an unscheduled draft"}`, id); return p;
}
function sheetQuickEdit(p){
  openSheet(`${p.id} · ${p.title}`, `<div class="fgrid">
    <label class="f full"><span>Status</span>${sel('id="qe-status"', STATUSES, p.status)}</label>
    <label class="f"><span>Planned month</span>${sel('id="qe-month"', monthOptions(), p.month)}</label>
    <label class="f"><span>Planned week</span>${sel('id="qe-week"', [["","—"],...WEEKS], p.week)}</label>
    <label class="f"><span>Target completion date</span><input class="in" type="date" id="qe-target" value="${attr(p.targetDate)}"></label>
    <label class="f"><span>Reason for change (optional)</span><input class="in" id="qe-reason"></label></div>
    <div class="row"><button class="btn primary" data-sh="save">Save</button><button class="btn" data-sh="close">Cancel</button></div>`,
  { save: () => { const st = v("qe-status");
      if(st==="Deferred" && p.status!=="Deferred"){ closeOverlay(true); sheetDefer(p); return; }
      reschedule(p, v("qe-month"), v("qe-week"), v("qe-reason")); p.targetDate = v("qe-target"); applyStatus(p, st); savePainting(p); closeOverlay(true); render(); toast("Saved"); } });
}
function reschedule(p, month, week, reason){
  if(month===p.month && week===p.week) return;
  p.history.push({date:todayISO(), from:{month:p.month, week:p.week}, to:{month, week}, reason:reason||""});
  logAct("reschedule", `Moved ${p.id} ${p.title} from ${monthLabel(p.month)} ${p.week||""} to ${monthLabel(month)} ${week||""}`.replace(/\s+/g," "), p.id);
  p.month = month; p.week = week; if(month) p.draft = false;
}
function applyStatus(p, st){
  if(st===p.status) return;
  const prev = p.status; p.status = st;
  if(st==="Completed" && !p.completedDate) p.completedDate = todayISO();
  if(ACTIVE.has(st) && !p.startDate) p.startDate = todayISO();
  if(prev==="Deferred" && st!=="Deferred" && p.deferral){ p.deferral.returned = todayISO(); }
  logAct("status", `${p.id} ${p.title}: ${prev} → ${st}`, p.id);
}
function sheetDefer(p){
  openSheet(`Defer ${p.id}`, `<div class="small muted">The painting keeps all its records. Its original plan (${esc(monthLabel(p.month))} ${esc(p.week)}) is saved.</div>
   <label class="f"><span>Reason</span><textarea class="in" id="df-reason" autofocus></textarea></label>
   <label class="f"><span>New target month (optional)</span>${sel('id="df-target"', [["","Decide later"],...monthOptions(false)], "")}</label>
   <div class="row"><button class="btn primary" data-sh="save">Defer painting</button><button class="btn" data-sh="close">Cancel</button></div>`,
  { save: () => { p.deferral = {date:todayISO(), reason:v("df-reason"), month:p.month, week:p.week, prevStatus:p.status, newTarget:v("df-target")};
      p.status = "Deferred"; logAct("defer", `Deferred ${p.id} ${p.title}${p.deferral.reason?" — "+p.deferral.reason:""}`, p.id); savePainting(p); closeOverlay(true); render(); toast("Painting deferred"); } });
}
function sheetReintroduce(p){
  const d = p.deferral||{}; const m = d.newTarget || d.month || p.month || "";
  openSheet(`Return ${p.id} to planning`, `<div class="fgrid">
    <label class="f"><span>Month</span>${sel('id="ri-month"', monthOptions(), m)}</label>
    <label class="f"><span>Week</span>${sel('id="ri-week"', [["","—"],...WEEKS], d.week||p.week)}</label>
    <label class="f full"><span>Status</span>${sel('id="ri-status"', STATUSES.filter(s=>s!=="Deferred"), d.prevStatus && d.prevStatus!=="Deferred" ? d.prevStatus : "Not Started")}</label></div>
    <div class="row"><button class="btn primary" data-sh="save">Return to planning</button><button class="btn" data-sh="close">Cancel</button></div>`,
  { save: () => { reschedule(p, v("ri-month"), v("ri-week"), "Returned from deferred"); applyStatus(p, v("ri-status")); savePainting(p); closeOverlay(true); render(); toast("Back in the plan"); } });
}

function sheetSession(pid, sid, pre){
